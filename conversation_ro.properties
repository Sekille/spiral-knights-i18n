m.lab_knight1_1a = Am recuperat tot ce am putut de pe Skylark, iar restul am improvizat cu \
	ajutorul Str\u0103inilor.

r.lab_knight1_1a = \u00cencheie conversa\u021bia

m.lab_knight2_1a = Emana\u021biile provenite din nucleul acestei lumi au avut efecte ciudate asupra \
	spiritelor noastre de lupt\u0103.

m.lab_knight3_1a = Am reu\u0219it s\u0103 recuper\u0103m generatorul secundar al navei Skylark aproape intact. \
	Din p\u0103cate, abia dac\u0103 este suficient de puternic pentru a men\u021bine acest laborator \u00een \
	func\u021biune, dar\u0103mite pentru a alimenta nava. Va trebui s\u0103 g\u0103sim o alt\u0103 surs\u0103 de energie dac\u0103 \
	vrem s\u0103 ne \u00eentoarcem vreodat\u0103 acas\u0103.

m.lab_knight4_1a = Echipele de recunoa\u0219tere au recuperat lucruri ciudate \u0219i remarcabile din \
	interiorul Clockworks.

m.lab_knight5_1a = {0}, ai \u00eent\u00e2lnit aceste minerale \u00een c\u0103l\u0103toriile tale? Sunt fascinante! Ar \
	trebui s\u0103-l \u00eentrebi pe Cavalerul Geolog-\u0218ef Wegner despre ele. Am auzit c\u0103 este expert \
	\u00een minerale!

m.lab_knight6_1a = Nu ne asum\u0103m niciun risc cu acest artefact pe care l-ai g\u0103sit, {0}. S-ar \
	putea ca gremlinii s\u0103 se \u00eentoarc\u0103 \u00eentr-o bun\u0103 zi dup\u0103 el. Fii \u00een gard\u0103!

m.lab_knight7_1a = Primele m\u0103sur\u0103tori sunt uimitoare, {0}! Nu am mai \u00eent\u00e2lnit niciodat\u0103 ceva \
	asem\u0103n\u0103tor. Va fi nevoie de timp pentru a \u00een\u021belege pe deplin la ce folose\u0219te acest obiect.

n.lab_hahn = Hahn
m.lab_hahn_1a = (Hahn pare ocupat \u0219i nu observ\u0103 prezen\u021ba ta)

## Progression NPCS
#...................................................................................................

# Snarbolax
m.lab_progress_1 = Pun pariu c\u0103 aceste Clopote ale Bestiei \u021bi-au fost de mare ajutor, nu-i a\u0219a, {0}?

r.lab_progress_cont = Continu\u0103
r.lab_progress_end = \u00cencheie conversa\u021bia

m.lab_progress_2 = \u00ce\u021bi mul\u021bumesc c\u0103 l-ai \u00eenvins pe Snarbolax. Prea mul\u021bi dintre scutierii no\u0219tri \
	\u0219i-au g\u0103sit sf\u00e2r\u0219itul din cauza acelei bestii. Pot r\u0103sufla u\u0219urat \u0219tiind c\u0103 pericolul a \
	trecut. \n\
	\n\
	A\u0219tept cu ner\u0103bdare s\u0103 aud despre viitoarele tale aventuri, soldat!

# Lab, Post-Attack
m.lab_progress_3 = Din fericire, laboratorul nu a suferit daune prea mari. Cel pu\u021bin \
	echipamentele necesare \u00eentre\u021binerii spiritelor noastre de lupt\u0103 au r\u0103mas intacte.

m.lab_progress_4 = Am dublat num\u0103rul patrulelor din jurul Haven, \u00een cazul unui alt atac, dar \
	am impresia c\u0103 gremlinii au ob\u021binut deja ceea ce c\u0103utau...

m.lab_progress_5 = Va mai dura pu\u021bin p\u00e2n\u0103 c\u00e2nd toate echipamentele noastre vor func\u021biona din nou \
	la capacitate maxim\u0103.

# Royal Jelly
m.lab_progress_6 = Palatul acela de gelatin\u0103... ce loc ciudat. M\u0103 \u00eentreb \u0219i ce era dispozitivul \
	neobi\u0219nuit pe care l-ai g\u0103sit \u00een interiorul palatului. Nu p\u0103rea s\u0103 fi fost construit de \
	fiin\u021bele gelatinoase.

m.lab_progress_7 = Foarte rar am \u00eent\u00e2lnit creaturi gelatinoase care s\u0103 nu ne atace imediat ce \
	ne v\u0103d. Acum \u00eei \u00eendep\u0103rtez \u021bepii acesteia. Sunt chiar dr\u0103gu\u021be c\u00e2nd nu \u00eencearc\u0103 s\u0103 te \
	str\u0103pung\u0103!

# Roarmulus
m.lab_progress_8 = Acest gremlin provine din colonia Emberlight, aflat\u0103 ad\u00e2nc \u00een Clockworks. \
	Sunt un grup de proscri\u0219i care s-au \u00eempotrivit Regelui Tinkinzar \u0219i Ordinului Crimson. \
	Sper\u0103m s\u0103 \u00eencheiem un tratat cu ei, care s\u0103 ne permit\u0103 s\u0103 folosim colonia lor drept baz\u0103 \
	pentru misiunile noastre din subteran.

m.emberlight_visitor_1a = Gremlinii din Emberlight \u00ee\u021bi mul\u021bumesc c\u0103 ai oprit aceast\u0103 amenin\u021bare.

r.emberlight_visitor_1a = Continu\u0103

m.emberlight_visitor_2a = Dar vin s\u0103 te avertizez! Ordinul Crimson nu se va opri la Proiectul \
	Roarmulus. Ordinul Crimson este hot\u0103r\u00e2t s\u0103 distrug\u0103 to\u021bi du\u0219manii. Cei \u00eenal\u021bi, cei mici \
	\u0219i proscri\u0219ii. To\u021bi sunt du\u0219mani ai Ordinului Crimson!

r.emberlight_visitor_2a = Mul\u021bumesc pentru avertisment, Pakrat.

m.emberlight_visitor_3a = Te pot ajuta cu ceva?
r.emberlight_visitor_3a = Spune-mi despre Emberlight.
r.emberlight_visitor_3b = De ce \u00eencearc\u0103 Regele Tinkinzar s\u0103 distrug\u0103 Haven?
r.emberlight_visitor_3c = Am aflat destule, mul\u021bumesc. (\u00cencheie conversa\u021bia)

m.emberlight_visitor_4a = Emberlight a fost fondat\u0103 de gremlinii proscri\u0219i din Marea Colonie. \
	Gremlinii din Emberlight nu respectau Legea de Fier, a\u0219a c\u0103 au fugit ca s\u0103 nu moar\u0103. Am \
	luat-o de la cap\u0103t \u00een Emberlight. Noua colonie este casa c\u00e2torva dintre noi: majoritatea \
	fo\u0219ti comploti\u0219ti, c\u00e2\u021biva negustori \u0219i c\u00e2\u021biva lupt\u0103tori. \u00cen ochii gremlinilor din Marea \
	Colonie, suntem cu to\u021bii tr\u0103d\u0103tori.

r.emberlight_visitor_4a = \u00cenc\u0103 o \u00eentrebare, Pakrat.

m.emberlight_visitor_4b = Nimeni nu \u0219tie sigur. Tinkinzar nu a mai fost v\u0103zut de foarte mul\u021bi \
	ani. Ordinul Crimson pune \u00een aplicare planurile lui Tinkinzar pentru Cradle. Emberlight a \
	fost o piedic\u0103 \u00een planul st\u0103p\u00e2nului, deoarece a fost construit\u0103 de proscri\u0219i. Haven este \
	probabil la fel, fiind fondat de creaturi care nu sunt gremlini. Nu face parte din plan!

# Vanaduke
m.lab_progress_9 = \u00cenc\u0103 un dispozitiv ciudat! Acesta nu a fost construit de almirieni, la fel \
	cum nici dispozitivul anterior nu a fost construit de creaturile gelatinoase. Totu\u0219i, am \
	observat un lucru: acest dispozitiv este \u00eenc\u0103 activ. \u00cen plus, semn\u0103tura sa energetic\u0103 este \
	asem\u0103n\u0103toare cu m\u0103sur\u0103torile pe care le-am f\u0103cut asupra Artefactului \u00eenainte s\u0103 fie furat. \
	Cred c\u0103 sunt necesare cercet\u0103ri suplimentare.

m.almire_historian_1a = Am recuperat pu\u021binele r\u0103m\u0103\u0219i\u021be din Fort\u0103rea\u021ba Owlite care ne ofer\u0103 \
	informa\u021bii despre Regatul Almire. \u00cempreun\u0103 cu fragmentele de informa\u021bii ob\u021binute de la \
	spiritele naturii din interiorul Cet\u0103\u021bii Firestorm, \u00eencepem s\u0103 ne form\u0103m o imagine mai clar\u0103 \
	asupra istoriei ora\u0219ului Almire.

r.almire_historian_1a = Ce ai aflat despre Almire?

m.almire_historian_2a = Din vechile tomuri pe care le-am recuperat, am aflat c\u0103 Cetatea \
	Firestorm f\u0103cea c\u00e2ndva parte dintr-un regat mult mai mare, cunoscut sub numele de Almire, \
	acum mii de ani. De\u0219i avea la grani\u021be \u0219i alte na\u021biuni agresive, Almire era renumit pentru \
	puterea militar\u0103 a numeroaselor sale legiuni. Aceste legiuni au protejat regatul mul\u021bi ani. \
	Din p\u0103cate, nu au fost suficiente.

r.almire_historian_2a = Ce s-a \u00eent\u00e2mplat cu restul regatului?

m.almire_historian_3a = Ei bine, acum \u0219tim c\u0103 existau citadele uria\u0219e care ad\u0103posteau for\u021bele \
	armate ale regatului Almire, precum \u0219i domenii vaste apar\u021bin\u00e2nd caselor nobiliare. Trebuie \
	s\u0103 fi fost o priveli\u0219te impresionant\u0103. Presupunem c\u0103 restul regatului este \u00eenc\u0103 undeva, \
	redus la ruine fumeg\u00e2nde. Este posibil ca unele p\u0103r\u021bi s\u0103 fi supravie\u021buit... de\u0219i, judec\u00e2nd \
	dup\u0103 informa\u021biile indirecte pe care le avem, acest lucru este foarte pu\u021bin probabil.

# Biscotti, Lab Pre-Selection
#...................................................................................................

m.lab_biscotti_1a = Salut! Sunt Biscotti, Buc\u0103tarul-\u0218ef al navei Skylark! \u00cenc\u0103 reglez ma\u0219ina de \
	alchimie pentru hrana spiritelor de lupt\u0103, a\u0219a c\u0103 te rog s\u0103 revii mai t\u00e2rziu.

r.lab_biscotti_1a = Spiritele de lupt\u0103 m\u0103n\u00e2nc\u0103 hran\u0103?

m.lab_biscotti_2a = Desigur! Un spirit de lupt\u0103 poate sintetiza materia \u0219i o poate transforma \
	\u00een energie utilizabil\u0103. Aceast\u0103 ma\u0219in\u0103 poate transforma anumite materiale \u00een hran\u0103 special\u0103 \
	pentru spirite... cel pu\u021bin dup\u0103 ce voi termina reglajele.

r.lab_biscotti_2a = Voi reveni mai t\u00e2rziu. Mul\u021bumesc.

# Biscotti, Lab Post-Selection
#...................................................................................................

m.lab_biscotti_3a = Salut, {0}! \u00cen calitate de Buc\u0103tar-\u0218ef al navei Skylark, am fost \u00eens\u0103rcinat \
	s\u0103 supraveghez dezvoltarea nutri\u021bional\u0103 a noilor no\u0219tri companioni, spiritele. Se pare c\u0103 \
	au devenit foarte diversificate \u00een ad\u00e2ncurile Clockworks. Va fi interesant s\u0103 vedem cum \
	evolueaz\u0103. \n\
	\n\
	Ai \u00eentreb\u0103ri despre hr\u0103nirea \u0219i \u00eengrijirea spiritului t\u0103u?

m.lab_biscotti_3aa = Mai ai \u0219i alte \u00eentreb\u0103ri despre hr\u0103nirea \u0219i \u00eengrijirea spiritului t\u0103u?

r.lab_biscotti_3a = Cum \u00eemi hr\u0103nesc spiritul de lupt\u0103?
r.lab_biscotti_3b = Spune-mi despre apetit.
r.lab_biscotti_3c = Spune-mi despre obiectele preferate.
r.lab_biscotti_3d = Spune-mi despre obiectele necesare.
r.lab_biscotti_3e = Nimic deocamdat\u0103, mul\u021bumesc.

m.lab_biscotti_4a = S\u0103-\u021bi hr\u0103ne\u0219ti spiritul de lupt\u0103 este simplu! Deschide interfa\u021ba spiritului \
	t\u0103u de lupt\u0103 \u0219i selecteaz\u0103 pictograma spiritului. De acolo po\u021bi selecta un material din \
	arsenalul t\u0103u \u0219i \u00eel po\u021bi pune \u00een tava de hr\u0103nire. \n\
	\n\
	Dup\u0103 ce ai ad\u0103ugat materialul pe care spiritul t\u0103u urmeaz\u0103 s\u0103-l sintetizeze, apas\u0103 pur \u0219i \
	simplu pe \u201eHr\u0103ne\u0219te spiritul\u201d. Poft\u0103 bun\u0103!

r.lab_biscotti_4a = Mai am \u0219i alte \u00eentreb\u0103ri.
r.lab_biscotti_4aa = At\u00e2t pentru moment, mul\u021bumesc!

m.lab_biscotti_4b = Spiritele au un anumit nivel de apetit, care limiteaz\u0103 cantitatea de \
	materiale pe care o pot m\u00e2nca la un moment dat. C\u00e2nd \u00eei oferi un material spiritului t\u0103u, \
	apetitul acestuia scade. C\u00e2nd se epuizeaz\u0103 complet, nu \u00eel vei mai putea hr\u0103ni.

r.lab_biscotti_4b = Cum cre\u0219te apetitul?

m.lab_biscotti_5b = Apetitul unui spirit cre\u0219te \u00een mod natural \u00een timp, dar destul de \u00eencet. \
	Pentru a-l cre\u0219te mai repede, ia-l cu tine \u00eentr-o aventur\u0103 prin Clockworks. Absorb\u021bia \
	c\u0103ldurii de la mon\u0219tri este o metod\u0103 excelent\u0103 de a arde calorii!

m.lab_biscotti_4c = La un moment dat, fiecare spirit are un \u201eobiect preferat\u201d, un material pe \
	care \u00eei place cel mai mult s\u0103-l m\u0103n\u00e2nce. Dac\u0103 \u00eei oferi unul dintre aceste obiecte, \u00eei faci \
	o bucurie \u0219i \u00eei oferi mult\u0103 c\u0103ldur\u0103.

r.lab_biscotti_4c = De unde pot ob\u021bine aceste obiecte?

m.lab_biscotti_5c = Obiectele preferate pot fi create prin alchimie folosind chiar ma\u0219ina \
	aceasta din fa\u021ba ta. Ai nevoie doar de dou\u0103 unit\u0103\u021bi din acela\u0219i material \u0219i de c\u00e2teva \
	minerale din Clockworks. Simplu!

m.lab_biscotti_4d = Obiectele necesare vor ap\u0103rea atunci c\u00e2nd spiritul t\u0103u este preg\u0103tit s\u0103-\u0219i \
	creasc\u0103 nivelul. Dup\u0103 ce spiritul a acumulat suficient\u0103 c\u0103ldur\u0103, deasupra t\u0103vii de hr\u0103nire \
	va ap\u0103rea o notificare privind \u201ematerialul necesar\u201d. Acest material TREBUIE oferit spiritului \
	pentru ca acesta s\u0103 poat\u0103 evolua \u00een continuare.

r.lab_biscotti_4d = Continu\u0103

m.lab_biscotti_5d = \u00cen majoritatea cazurilor, acesta este un obiect preferat obi\u0219nuit, dar \
	atunci c\u00e2nd spiritul t\u0103u este preg\u0103tit s\u0103 evolueze, va fi necesar un Catalizator de Evolu\u021bie.

# Riley, Harness Merchant
#...................................................................................................

m.lab_harness_1a = Sunt Riley, asistenta lui Morlin. Lucrez la inventarea unei metode prin care \
	s\u0103 \u00eembun\u0103t\u0103\u021bim \u0219i mai mult spiritele noastre de lupt\u0103. Revino mai t\u00e2rziu, dup\u0103 ce vei ob\u021bine \
	un spirit legat permanent de tine.

r.lab_harness_1a = Voi reveni mai t\u00e2rziu. Mul\u021bumesc.

# Morlin, Sprite Tutorial
#...................................................................................................

m.sprite_tut_1a = Salut\u0103ri, {0}. Presupun c\u0103 ai c\u00e2teva \u00eentreb\u0103ri despre spiritele de lupt\u0103. \
	Cu ce te pot ajuta?
m.sprite_tut_1aa = Mai ai \u00eentreb\u0103ri despre spiritele de lupt\u0103? Cu ce te pot ajuta?

r.sprite_tut_1a = Cum cresc spiritele \u00een nivel \u0219i cum evolueaz\u0103?
r.sprite_tut_1b = Spune-mi despre abilit\u0103\u021bile spiritelor.
r.sprite_tut_1c = Ce sunt hamurile spiritelor?
r.sprite_tut_1d = Ce avantaje au spiritele?
r.sprite_tut_1e = Nimic deocamdat\u0103, mul\u021bumesc.

m.sprite_tut_2a = Spiritele de lupt\u0103 cresc \u00een nivel acumul\u00e2nd c\u0103ldur\u0103, la fel ca armele \u0219i \
	echipamentul t\u0103u. Pot acumula c\u0103ldur\u0103 \u00een dou\u0103 moduri: absorbind-o \u00een timp ce lup\u021bi \u00een \
	Clockworks \u0219i consum\u00e2nd materiale pe care le sintetizeaz\u0103 apoi \u00een c\u0103ldur\u0103.

r.sprite_tut_2a = Continu\u0103

m.sprite_tut_3a = Hr\u0103nirea spiritului t\u0103u cu materiale este cea mai rapid\u0103 metod\u0103 de a-l ajuta \
	s\u0103 creasc\u0103 \u00een nivel. Vorbe\u0219te cu Biscotti aici, \u00een Laborator, pentru mai multe informa\u021bii \
	despre hr\u0103nirea spiritelor.

r.sprite_tut_3a = \u0218i cum evolueaz\u0103 spiritul meu?

m.sprite_tut_4a = Spiritul t\u0103u va evolua pe m\u0103sur\u0103 ce \u00eei cre\u0219ti nivelul. La anumite niveluri \
	importante, spiritul va avea nevoie s\u0103 consume un Catalizator de Evolu\u021bie pentru a putea \
	continua s\u0103 creasc\u0103 \u00een nivel. Dup\u0103 ce \u00eel consum\u0103, aspectul spiritului se va schimba fizic! \n\
	\n\
	Va fi interesant s\u0103 vedem cum evolueaz\u0103 \u00een timp aceste forme noi \u0219i ciudate ale spiritelor \
	de lupt\u0103.

r.sprite_tut_4a = Mai am \u0219i alte \u00eentreb\u0103ri.
r.sprite_tut_4aa = At\u00e2t pentru moment, mul\u021bumesc!

m.sprite_tut_2b = Pe m\u0103sur\u0103 ce un spirit cre\u0219te \u00een nivel, \u00eenva\u021b\u0103 noi abilit\u0103\u021bi de lupt\u0103 \u0219i \
	ob\u021bine puncte de abilitate.

r.sprite_tut_2b = Continu\u0103

m.sprite_tut_3b = Fiecare spirit de lupt\u0103 va \u00eenv\u0103\u021ba trei abilit\u0103\u021bi pe care le po\u021bi folosi \u00een \
	lupt\u0103. Abilit\u0103\u021bile sunt \u00eenv\u0103\u021bate automat la anumite niveluri, pe m\u0103sur\u0103 ce spiritul avanseaz\u0103. \n\
	\n\
	Abilit\u0103\u021bile de lupt\u0103 devin mai puternice cu ajutorul punctelor de abilitate.

r.sprite_tut_3b = Continu\u0103

m.sprite_tut_4b = Prime\u0219ti puncte de abilitate \u00een mod regulat, pe m\u0103sur\u0103 ce spiritul cre\u0219te \
	\u00een nivel. Acestea pot fi alocate abilit\u0103\u021bilor din interfa\u021ba spiritului de lupt\u0103. \n\
	\n\
	C\u00e2nd folose\u0219ti un punct de abilitate, trebuie s\u0103 alegi un atribut pe care vrei s\u0103-l \
	\u00eembun\u0103t\u0103\u021be\u0219ti, cum ar fi timpul de re\u00eenc\u0103rcare sau daunele generale.

r.sprite_tut_4b = Continu\u0103

m.sprite_tut_5b = \u0218i nu-\u021bi face griji c\u0103 ai putea folosi punctele de abilitate \u00eentr-un mod \
	\u201egre\u0219it\u201d. \u00cen cele din urm\u0103, vei ob\u021bine suficiente puncte pentru a maximiza toate abilit\u0103\u021bile!

r.sprite_tut_5b = Continu\u0103

m.sprite_tut_6b = Dup\u0103 ce ai folosit toate punctele de abilitate \u0219i spiritul t\u0103u a ajuns la un \
	nivel foarte ridicat, vei putea \u00eencepe s\u0103 alegi \u201eabilit\u0103\u021bile supreme\u201d. Acestea sunt versiuni \
	\u00eembun\u0103t\u0103\u021bite ale abilit\u0103\u021bilor spiritului t\u0103u. Fiecare abilitate are dou\u0103 variante supreme \
	din care po\u021bi alege.

r.sprite_tut_6b = Continu\u0103

m.sprite_tut_7b = Po\u021bi alege doar o singur\u0103 abilitate suprem\u0103 pentru fiecare abilitate a \
	spiritului, a\u0219a c\u0103 alege cu grij\u0103! Re\u021bine \u0219i c\u0103 selectarea abilit\u0103\u021bilor supreme va modifica \
	\u00een continuare aspectul spiritului t\u0103u. \n\
	\n\
	Cu toate aceste op\u021biuni, spiritul t\u0103u de nivel maxim va ar\u0103ta \u0219i se va comporta cu siguran\u021b\u0103 \
	diferit de celelalte!

r.sprite_tut_7b = Mai am \u0219i alte \u00eentreb\u0103ri.
r.sprite_tut_7bb = At\u00e2t pentru moment, mul\u021bumesc!

m.sprite_tut_2c = Toate spiritele de lupt\u0103 poart\u0103 un ham mecanic care le adapteaz\u0103 abilit\u0103\u021bile \
	la un anumit tip de daune. Totu\u0219i, nu toate spiritele pot purta toate tipurile de hamuri. \
	De exemplu, un drakon nu poate provoca daune prin perforare. \n\
	\n\
	\u00cen mod implicit, ai un ham de fier pe care \u00eel poate echipa orice spirit. Dac\u0103 vrei s\u0103 ai \
	mai multe op\u021biuni, la fel ca \u00een cazul armelor \u0219i echipamentului, trebuie s\u0103 cumperi hamuri noi.

r.sprite_tut_2c = De unde pot cump\u0103ra mai multe hamuri?

m.sprite_tut_3c = Vorbe\u0219te cu Riley aici, \u00een Laborator, pentru a cump\u0103ra hamuri noi. Dup\u0103 \
	cump\u0103rare, un ham este ad\u0103ugat automat \u00een lista ta de hamuri din interfa\u021ba spiritului de \
	lupt\u0103. \n\
	\n\
	\u00cen plus, de fiecare dat\u0103 c\u00e2nd cumperi o \u00eembun\u0103t\u0103\u021bire direct\u0103 pentru un ham pe care \u00eel de\u021bii, \
	acesta va fi \u00eenlocuit cu varianta superioar\u0103.

r.sprite_tut_3c = Continu\u0103

m.sprite_tut_4c = \u00cembun\u0103t\u0103\u021birile hamurilor merit\u0103 cu siguran\u021b\u0103 coroanele cheltuite. Variantele \
	superioare ale fiec\u0103rui ham reduc timpul de re\u00eenc\u0103rcare al abilit\u0103\u021bilor de lupt\u0103!

r.sprite_tut_4c = Mai am \u0219i alte \u00eentreb\u0103ri.
r.sprite_tut_4cc = At\u00e2t pentru moment, mul\u021bumesc!

m.sprite_tut_2d = Spiritele de lupt\u0103 ob\u021bin avantaje la anumite niveluri, pe care le po\u021bi echipa \
	din interfa\u021ba spiritului de lupt\u0103. Aceste avantaje \u00ee\u021bi ofer\u0103 bonusuri pentru statistici.

r.sprite_tut_2d = Continu\u0103

m.sprite_tut_3d = Avantajele sunt deblocate aleatoriu. Unele sunt mult mai rare dec\u00e2t altele \u0219i \
	vor necesita ca spiritul s\u0103 ajung\u0103 la un nivel foarte ridicat pentru a le debloca pe toate. \n\
	\n\
	Po\u021bi ob\u021bine avantaje chiar \u0219i dup\u0103 ce ajungi la nivelul 100!

r.sprite_tut_3d = Mai am \u0219i alte \u00eentreb\u0103ri.
r.sprite_tut_3dd = At\u00e2t pentru moment, mul\u021bumesc!

## HAVEN STRANGERS

# Hailoh
#...................................................................................................

n.hav_greeter = Hailoh

m.hav_greeter_1a = Bine ai venit \u00een Haven, micu\u021bule. Al\u0103tur\u0103-te prietenilor t\u0103i \u0219i aduna\u021bi \
	obiecte str\u0103lucitoare din Clockworks. Str\u0103inilor le plac \u00eentotdeauna lucrurile str\u0103lucitoare.

r.hav_greeter_1a = \u00cencheie conversa\u021bia

# Warnel
#...................................................................................................

n.hav_snipes = Warnel

m.hav_snipes_1a = Ai grij\u0103 s\u0103 nu calci pe vreunul dintre snipes, micu\u021bule.

r.hav_snipes_1a = Snipes?

m.hav_snipes_2a = Snipes sunt p\u0103s\u0103rile gra\u021bioase, adorabile \u0219i plinu\u021be pe care le vezi \
	plimb\u00e2ndu-se prin Haven. Unii spun c\u0103 sunt cele mai frumoase creaturi din galaxie, dar \
	nu ai auzi niciodat\u0103 asta chiar de la ele, deoarece sunt incredibil de modeste.

r.hav_snipes_2a = \u00cencheie conversa\u021bia

# Plinkop
#...................................................................................................

n.hav_clock = Plinkop

m.hav_clock_1a = Bun\u0103, micu\u021bule. Pari s\u0103 ai nevoie de ni\u0219te informa\u021bii.

r.hav_clock_1a = Spune-mi ce \u0219tii despre Clockworks.

r.hav_clock_1b = Nimic deocamdat\u0103, mul\u021bumesc.

m.hav_clock_2a = \u00ce\u021bi voi \u00eemp\u0103rt\u0103\u0219i tot ce \u0219tiu, micu\u021bule.

r.hav_clock_2a = C\u00e2t de vechi este Clockworks?

r.hav_clock_2b = Cum a fost creat Clockworks?

r.hav_clock_2c = Ce se afl\u0103 \u00een centrul Clockworks?

r.hav_clock_2d = M-am r\u0103zg\u00e2ndit. Am de f\u0103cut ni\u0219te aventuri. Pa!

m.hav_clock_3a = Este greu de spus cu exactitate, deoarece multe dintre lucrurile care se afl\u0103 \
	acolo par s\u0103 provin\u0103 din lumi diferite. Unele par s\u0103 vin\u0103 din t\u0103r\u00e2muri foarte vechi, care \
	probabil au fost c\u00e2ndva casa nenum\u0103ra\u021bilor zei \u0219i creaturi str\u0103vechi.\n\
	\n\
	Aceast\u0103 lume este una artificial\u0103. Ceea ce vezi \u00een interiorul ei nu ar fi trebuit s\u0103 existe \
	niciodat\u0103 aici. Istoriile marilor lumi, \u00eenv\u00e2rtindu-se la nesf\u00e2r\u0219it prin ro\u021bile acestei \
	ma\u0219in\u0103rii uria\u0219e... Mi se pare foarte trist.

m.hav_clock_3b = Exist\u0103 mai multe teorii. Unii spun c\u0103 gremlinii pe care \u00eei vezi lucr\u00e2nd acum \
	la aceast\u0103 ma\u0219in\u0103rie sunt responsabili. Dar pare o sarcin\u0103 prea mare chiar \u0219i pentru for\u021ba \
	lor de munc\u0103 aparent infinit\u0103. Chiar dac\u0103 ar fi avut mijloacele necesare, cum au \u201e\u00eenceput\u201d? \
	De unde au ob\u021binut energia?

m.hav_clock_3c = Ceva cu o putere imens\u0103, micu\u021bule. Din centrul Clockworks provine un semnal \
	energetic uria\u0219, dar asta este tot ce \u0219tim. Nimeni nu a ajuns vreodat\u0103 la nucleu. Sau, cel \
	pu\u021bin, dac\u0103 cineva a ajuns acolo, nu s-a mai \u00eentors niciodat\u0103.\n\
	\n\
	Ar trebui s\u0103-i \u00eentrebi pe gremlini, pentru c\u0103 probabil au ajuns mai ad\u00e2nc \u00een Clockworks \
	dec\u00e2t orice alt\u0103 creatur\u0103. Dar s-ar putea s\u0103 fie dificil, deoarece sunt destul de \
	neprietenos\u0326i.

r.hav_clock_3a = Mai am o \u00eentrebare.

r.hav_clock_3b = Mul\u021bumesc pentru informa\u021bii, omule \u00eenalt. Ne mai vedem prin ora\u0219.

# Bootshuze
#...................................................................................................

n.hav_grem = Bootshuze

m.hav_grem_1a = Bun\u0103, micu\u021bule. Pari s\u0103 ai nevoie de ni\u0219te informa\u021bii.

r.hav_grem_1a = Spune-mi ce \u0219tii despre gremlini.

r.hav_grem_1b = Nimic deocamdat\u0103, mul\u021bumesc.

m.hav_grem_2a = Cuno\u0219tin\u021bele mele \u00ee\u021bi stau la dispozi\u021bie, micu\u021bule.

r.hav_grem_2a = Ce sunt, mai exact, gremlinii?

r.hav_grem_2b = Gremlinii au un conduc\u0103tor?

r.hav_grem_2c = Exist\u0103 gremlini prieteno\u0219i \u00een Clockworks?

r.hav_grem_2d = De fapt, trebuie s\u0103 plec. Poate alt\u0103 dat\u0103...

m.hav_grem_3a = Gremlinii sunt o ras\u0103 de creaturi extrem de pricepute la construirea \u0219i \
	dezasamblarea tuturor felurilor de ma\u0219in\u0103rii. Sunt, \u00een acela\u0219i timp, o legiune de inventatori \
	geniali \u0219i o for\u021b\u0103 capabil\u0103 de distrugeri uria\u0219e.

m.hav_grem_3b = To\u021bi gremlinii care fac parte din colonie \u00eel slujesc pe Regele Tinkinzar. Se \
	spune c\u0103 Tinkinzar este un conduc\u0103tor m\u0103re\u021b \u0219i un geniu mecanic, responsabil pentru \
	concep\u021bia \u00eentregului Clockworks. Totu\u0219i, din c\u00e2te \u0219tim, regele nu este v\u0103zut niciodat\u0103 de \
	gremlinii obi\u0219nui\u021bi. \u00cen schimb, ordinele sale sunt transmise \u0219i puse \u00een aplicare de Ordinul \
	Crimson, o grupare de gremlini \u00eenfrico\u0219\u0103toare \u0219i fanatic\u0103, ai c\u0103rei membri sunt singurii \
	c\u0103rora le este permis\u0103 audien\u021ba \u00een fa\u021ba marelui rege.

m.hav_grem_3c = Majoritatea te vor ataca imediat ce te v\u0103d, dar exist\u0103 \u0219i c\u00e2\u021biva proscri\u0219i din \
	colonie care \u0219i-au g\u0103sit refugiul \u00een ora\u0219ele de sub suprafa\u021b\u0103. Via\u021ba lor este grea, deoarece \
	sunt ur\u00e2\u021bi de propria ras\u0103 \u0219i nu mai au o lume pe care s\u0103 o numeasc\u0103 acas\u0103.

r.hav_grem_3a = Mai am o \u00eentrebare.

r.hav_grem_3b = Mul\u021bumesc pentru informa\u021bii, omule \u00eenalt. Ne mai vedem prin ora\u0219.



