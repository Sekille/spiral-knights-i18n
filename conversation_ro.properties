m.mission_cogknight_epilogue_e = Ne va lua o ve\u0219nicie s\u0103 descifr\u0103m criptografia gremlinilor...

m.mission_apocrea_warden = Dac\u0103 mergi mai departe, fii \u00een gard\u0103. Simt c\u0103 este o capcan\u0103.

n.och_leader_1 = Feron

m.och_leader_1_1a = Salut\u0103ri, {0}! M\u0103 bucur s\u0103 v\u0103d c\u0103 Cartierul General Spiral ne-a trimis \
	\u00eent\u0103riri, \u0219i \u00eenc\u0103 la timp! Suntem \u00eentr-o situa\u021bie disperat\u0103 \u0219i avem nevoie de ajutorul t\u0103u!

r.och_leader_1_1a = Cum v\u0103 pot ajuta, locotenente?

m.och_leader_1_2a = \u00cenaintarea noastr\u0103 a fost oprit\u0103 de artileria de pe ziduri, care ne \u021bine \
	sub foc continuu. Mai devreme am organizat o diversiune pentru a permite unei mici echipe \
	de cavaleri s\u0103 treac\u0103 de linia frontului \u0219i s\u0103 distrug\u0103 acea artilerie... dar se pare c\u0103 au \
	e\u0219uat. Acum sunt bloca\u021bi acolo, iar noi am r\u0103mas aici! \n\
	\n\
	Am nevoie s\u0103 treci de liniile inamice, s\u0103 intri \u00een centrul de control al artileriei \u0219i s\u0103 \
	g\u0103se\u0219ti o modalitate de a distruge definitiv tunurile! \u00centre timp, voi reorganiza trupele \
	pentru a putea continua atacul dup\u0103 tine. Mult noroc acolo, soldat!

r.och_leader_1_2a = Nu v\u0103 voi dezam\u0103gi, locotenente.

n.och_leader_2 = Feron

m.och_leader_2_1a = Bine lucrat, {0}! A fost un adev\u0103rat spectacol de artificii! Datorit\u0103 \u021bie, \
	am reu\u0219it s\u0103 eliber\u0103m zona aceea blestemat\u0103 de aterizare \u0219i s\u0103 ne mut\u0103m baza de opera\u021biuni \
	la por\u021bile interioare!

r.och_leader_2_1a = Ce urmeaz\u0103, locotenente?

m.och_leader_2_2a = Acele ro\u021bi din\u021bate masive ne stau \u00een cale, iar rapoartele serviciilor de \
	informa\u021bii spun c\u0103 singura modalitate de a le deschide este din interiorul a dou\u0103 cl\u0103diri \
	de control adiacente. Nu voi sacrifica vie\u021bi inutil atac\u00e2nd direct cl\u0103direa din fa\u021b\u0103. \
	Trebuie s\u0103 g\u0103se\u0219ti o cale ocolitoare. Ocole\u0219te ap\u0103rarea, intr\u0103 \u00een cl\u0103direa de control \u0219i \
	deschide por\u021bile!

r.och_leader_2_2a = Por\u021bile sunt ca \u0219i deschise, locotenente!

n.och_leader_3 = Feron

m.och_leader_3_1a = (Locotenentul Feron pare s\u0103 fi fost r\u0103nit) \n\
	\n\
	Iat\u0103-te, {0}. Ai venit pentru marea final\u0103, nu-i a\u0219a?

r.och_leader_3_1a = Sunte\u021bi bine, locotenente?

m.och_leader_3_2a = Au fost nenoroci\u021bii aceia care se camufleaz\u0103! Au ie\u0219it din umbre \u0219i ne-au \
	atacat prin surprindere. C\u00e2nd pun m\u00e2na pe Seerus, o s\u0103-i... Argh! \n\
	\n\
	(Feron se pr\u0103bu\u0219e\u0219te \u00eentr-o parte, fiind \u00een mod clar mai grav r\u0103nit dec\u00e2t p\u0103rea la \u00eenceput) \n\
	\n\
	La naiba, abia mai pot s\u0103-mi \u021bin sabia...

r.och_leader_3_2a = Locotenente, nu cred c\u0103...

m.och_leader_3_3a = Da, se pare c\u0103 nu mai sunt \u00een stare s\u0103 lupt. Acum totul depinde de tine, \
	{0}. Doar tu ai puterea necesar\u0103 pentru a-l \u00eenfrunta pe Seerus \u0219i a-l aduce \u00een fa\u021ba justi\u021biei. \
	Mul\u021bi cavaleri \u0219i-au pierdut via\u021ba aici ast\u0103zi. Onoreaz\u0103-le memoria duc\u00e2nd misiunea la bun sf\u00e2r\u0219it!

r.och_leader_3_3a = Am \u00een\u021beles, locotenente. \u00cel voi face pe Mare\u0219al s\u0103 pl\u0103teasc\u0103.

n.och_leader_4 = Feron

m.och_leader_4_1a = {0}! Abia \u00eemi vine s\u0103 cred c\u0103 ai reu\u0219it s\u0103-l \u00eenfrun\u021bi pe Mare\u0219al direct \u0219i \
	s\u0103 ie\u0219i viu din acel infern! Ai toate calit\u0103\u021bile unui adev\u0103rat erou!

r.och_leader_4_1a = Ar\u0103ta\u021bi mult mai bine, locotenente.

m.och_leader_4_2a = Cu ajutorul biotehnicienilor, ar trebui s\u0103 m\u0103 recuperez \u0219i s\u0103 revin la \
	datorie \u00een cel mai scurt timp. {0}, nu pot sublinia \u00eendeajuns c\u00e2t de important\u0103 este aceast\u0103 \
	victorie pentru to\u021bi Cavalerii Spiral. Ne-ai ajutat s\u0103 d\u0103m o lovitur\u0103 puternic\u0103 Ordinului \
	Crimson, distrug\u00e2nd Marele lor Arsenal. \n\
	\n\
	Datorit\u0103 \u021bie, for\u021bele gremlinilor nu vor mai avea acces la aceste ma\u0219ini de r\u0103zboi uria\u0219e \
	pentru o vreme. Iar tehnicienii no\u0219tri studiaz\u0103 acum tot ce au g\u0103sit \u00een \u00eenc\u0103perile personale \
	ale lui Seerus. Am putea ob\u021bine informa\u021bii valoroase despre tehnologia gremlinilor sau chiar \
	despre locul \u00een care se afl\u0103 restul Ordinului Crimson!

r.och_leader_4_2a = A fost o onoare s\u0103 v\u0103 ajut.

m.och_leader_4_3a = Odihne\u0219te-te pu\u021bin \u0219i bucur\u0103-te de aceast\u0103 victorie extraordinar\u0103. \
	Cu siguran\u021b\u0103, Cartierul General Spiral te va chema din nou!

r.och_leader_4_3a = Pe data viitoare, locotenente.

