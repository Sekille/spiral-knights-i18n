## CORE RESEARCH

# Vaelyn
#...................................................................................................

n.core_lead = Vaelyn
n.parmas_scout = Cerceta\u0219ul Parmei

m.core_lead_1 = Salut\u0103ri. Sunt locotenentul Vaelyn, ofi\u021berul care conduce cercet\u0103rile asupra \
	Nucleului. E\u0219ti, f\u0103r\u0103 \u00eendoial\u0103, unul dintre cei mai puternici Cavaleri Spiral care au ajuns \
	\u00een aceste ad\u00e2ncuri infernale, dar doar puterea nu te va duce mai departe.

r.core_lead_1 = Care este situa\u021bia, locotenente?

m.core_lead_2 = \u00cencerc\u0103m s\u0103 g\u0103sim o metod\u0103 de activare a Nucleului folosind puterea mineralelor \
	g\u0103site \u00een Clockworks. Aceste minerale pot transforma Clockworks, lucru pe care l-am observat \
	\u00een Arcade din Haven. Credem c\u0103 putem folosi aceast\u0103 putere pentru a activa Nucleul \u0219i... \
	poate chiar pentru a-l deschide.

r.core_lead_2 = Vre\u021bi s\u0103-l deschide\u021bi?

m.core_lead_3 = Da. C\u0103pitanul Ozlo \u00eensu\u0219i a ordonat s\u0103 rezist\u0103m c\u00e2t mai mult posibil \u0219i s\u0103 \
	afl\u0103m tot ce putem. Dac\u0103 vom p\u0103r\u0103si vreodat\u0103 aceast\u0103 planet\u0103, va fi datorit\u0103 acestui Nucleu. \n\
	\n\
	Sunt convins\u0103 c\u0103, pe l\u00e2ng\u0103 faptul c\u0103 ar putea fi o surs\u0103 de energie, Nucleul este un fel de \
	centru nervos pentru tot ceea ce vezi \u00een Clockworks. Po\u021bi sim\u021bi asta chiar \u0219i \u00een aerul \
	pu\u021bin de aici, o senza\u021bie s\u0103lbatic\u0103 \u0219i amenin\u021b\u0103toare care \u00ee\u021bi spune c\u0103 nu este doar o simpl\u0103 \
	ma\u0219in\u0103rie.

r.core_lead_3 = Vrei s\u0103 spui c\u0103 este... viu?

m.core_lead_4 = Vreau s\u0103 spun c\u0103 \u0219tim c\u0103 \u00eentreaga lume aceasta nu este natural\u0103, iar eu una \
	nu cred c\u0103 hoardele acelea de gremlini nenoroci\u021bi, oric\u00e2t de harnici ar fi, ar fi putut \
	construi o lume \u00eentreag\u0103. Trebuie s\u0103 fi fost ajuta\u021bi de ceva cu mult peste puterile lor, iar \
	poate c\u0103 acel ceva se afl\u0103 \u00een Nucleu. \n\
	\n\
	Acela\u0219i lucru este valabil \u0219i pentru Escadrila Alpha. Nu ar fi disp\u0103rut pur \u0219i simplu, nici \
	m\u0103car \u00een cele mai \u00eendep\u0103rtate ad\u00e2ncuri ale Clockworks. Erau cei mai buni dintre noi. Nucleul \
	este cel care i-a \u00eenghi\u021bit.

r.core_lead_4 = Dar credeam c\u0103 nu exist\u0103 nicio cale de a intra \u00een el.

m.core_lead_5 = Nu \u0219tiu cum, dar trebuie s\u0103 fi g\u0103sit o cale. Trebuie s\u0103 fi reu\u0219it... iar acum \
	au disp\u0103rut.

r.core_lead_5 = \u00cencheie conversa\u021bia


# Technician
#...................................................................................................

n.core_tech = Tehnician

m.core_tech_1 = Bine ai venit \u00een tab\u0103ra de cercetare de la Nucleu. Ai nout\u0103\u021bi de la suprafa\u021b\u0103?

r.core_tech_1 = A\u0219 dori s\u0103 \u0219tiu cum pot ajuta.

m.core_tech_2 = Este simplu: continu\u0103 s\u0103 aduni minerale din Clockworks \u0219i s\u0103 alimentezi por\u021bile \
	din Arcade. Trebuie s\u0103 analiz\u0103m modul \u00een care energia mineralelor afecteaz\u0103 Nucleul. Problema \
	este c\u0103 foarte pu\u021bin\u0103 energie ajunge p\u00e2n\u0103 la aceste ad\u00e2ncimi. Putem colecta doar o cantitate \
	limitat\u0103 de date de la fiecare poart\u0103 atunci c\u00e2nd aceasta este activat\u0103.

r.core_tech_2 = Altceva?

m.core_tech_3 = Aer curat? C\u0103ldur\u0103? Aceste ad\u00e2ncuri nu sunt un mediu \u00een care mul\u021bi dintre noi \
