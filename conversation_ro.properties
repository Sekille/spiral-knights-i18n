# Greeter
#...................................................................................................

n.atg_greeter = Konway

m.atg_greeter_1a = Bine ai venit \u00een sala noastr\u0103 de antrenament avansat. Aici vei g\u0103si \
	sfaturi utile pentru supravie\u021buire, care te vor ajuta \u00een c\u0103l\u0103toria ta prin Clockworks. \n\
	\n\
	Dore\u0219ti c\u00e2teva indica\u021bii?

r.atg_greeter_1a = Sigur. De unde ar trebui s\u0103 \u00eencep?

r.atg_greeter_1b = Nu, mul\u021bumesc. Voi explora singur locul.

m.atg_greeter_2a = Spre vest vei \u00eenv\u0103\u021ba despre obiectele utile pe care le po\u021bi g\u0103si \u00een \
	Clockworks. Spre nord vei \u00eenv\u0103\u021ba despre diferite tipuri de blocuri \u0219i u\u0219i. Spre est vei \
	g\u0103si o varietate de capcane \u0219i pericole, precum \u0219i o sal\u0103 de lupt\u0103 unde po\u021bi exersa ap\u0103rarea \
	\u00eempotriva cuburilor de antrenament. Nu-\u021bi face griji, am luat toate m\u0103surile necesare pentru \
	ca acele cuburi s\u0103 fie complet inofensive!

r.atg_greeter_2a = Mul\u021bumesc! Pornesc s\u0103 explorez.

## HAVEN KNIGHTS

# Fountain
#...................................................................................................

n.fountain = Cort

m.fountain_1 = Salut\u0103ri \u0219i bine ai venit \u00een Haven! Dac\u0103 mergi spre nord, vei ajunge la Arcade, \
	unde po\u021bi afla toate detaliile despre misiunea noastr\u0103. Dac\u0103 mergi spre vest, vei ajunge la \
	Bazaar, unde Str\u0103inii au o selec\u021bie de echipamente \u0219i arme de v\u00e2nzare. Nu uita s\u0103 le verifici \
	marfa zilnic, deoarece se schimb\u0103!

r.fountain_1 = Mul\u021bumesc pentru informa\u021bii. Pornesc s\u0103 explorez!

# Gym Signpost
#...................................................................................................

n.atg_guard = Keston

m.atg_guard = Salut\u0103ri! Dincolo de aceast\u0103 u\u0219\u0103 vei g\u0103si sala de antrenament avansat. \u00cen calitate \
	de Cavaler Spiral, o po\u021bi folosi oric\u00e2nd pentru a-\u021bi exersa abilit\u0103\u021bile \u0219i pentru a afla mai \
	multe despre Clockworks.

r.atg_guard = Mul\u021bumesc! Voi vedea ce se afl\u0103 \u00een\u0103untru.

# Arcade Leader
#...................................................................................................

n.arc_leader = Feron

m.arc_leader_1 = Bine ai venit, soldat, \u0219i felicit\u0103ri pentru c\u0103 ai ajuns la baza noastr\u0103 din \
	Haven. Sunt locotenentul Feron. C\u0103pitanul Ozlo m-a \u00eens\u0103rcinat s\u0103 supraveghez opera\u021biunea \
	noastr\u0103 de exploatare minier\u0103 din Clockworks.\n\
	\n\
	\u00cen fa\u021ba ta se afl\u0103 \u201eArcade\u201d, un complex fascinant care reprezint\u0103 leg\u0103tura noastr\u0103 cu inima \
	Clockworks. Fiindc\u0103 e\u0219ti nou aici, \u00ee\u021bi voi explica pe scurt ce ne-a cerut Cartierul General \
	Spiral s\u0103 facem.

r.arc_leader_1 = Pare ceva important. Spune-mi cum func\u021bioneaz\u0103 totul.

m.arc_leader_2 = Dup\u0103 pr\u0103bu\u0219irea navei Skylark, nucleul s\u0103u principal de tearium a explodat, \
	distrug\u00e2nd o parte din nav\u0103 \u0219i l\u0103s\u00e2nd-o f\u0103r\u0103 principala surs\u0103 de energie. Cum p\u00e2n\u0103 acum nu am \
	g\u0103sit nic\u0103ieri c\u00e2teva sute de tone de tearium, pas\u0103rea aceasta a r\u0103mas practic f\u0103r\u0103 aripi.\n\
	\n\
	Cu ajutorul Str\u0103inilor, am reu\u0219it s\u0103 \u00eenfiin\u021b\u0103m o mic\u0103 baz\u0103 de opera\u021biuni aici, \u00een Haven. Dup\u0103 \
	ce ne-am pornit sistemele, am descoperit c\u0103 \u00een inima acestei st\u00e2nci se afl\u0103 o surs\u0103 de energie \
	de o amploare f\u0103r\u0103 precedent.

r.arc_leader_2 = Dac\u0103 am putea cumva s\u0103 valorific\u0103m acea energie...

m.arc_leader_3 = Exact! Nucleul Clockworks ar putea con\u021bine sursa de energie de care avem nevoie \
	pentru a crea o nou\u0103 surs\u0103 de alimentare pentru Skylark \u0219i a o readuce \u00een stare de func\u021bionare. \
	Exist\u0103 \u00eens\u0103 o singur\u0103 problem\u0103: Clockworks pare s\u0103 fi fost construit ca un fel de capcan\u0103 \
	mortal\u0103 nebuneasc\u0103.\n\
	\n\
	Nu va fi u\u0219or s\u0103 ajungem la Nucleu...

r.arc_leader_3 = Sunt preg\u0103tit pentru aceast\u0103 provocare!

m.arc_leader_4 = \u00cemi place spiritul acesta. Iat\u0103 cum func\u021bioneaz\u0103: folose\u0219ti por\u021bile din fa\u021b\u0103 \
	pentru a explora Clockworks \u0219i a recupera minerale speciale. Apoi depui acele minerale \u00een \
	por\u021bi pentru a modifica Clockworks-ul de dedesubt \u0219i a crea niveluri noi, neexplorate.\n\
	\n\
	Credem c\u0103 mineralele sunt cheia pentru deschiderea unui drum c\u0103tre Nucleu. Trebuie doar s\u0103 \
	descoperim cum s\u0103 le folosim!

r.arc_leader_4 = Mi-am \u00een\u021beles misiunea.

m.arc_leader_5 = Ai dovedit c\u0103 e\u0219ti preg\u0103tit de lupt\u0103 \u0219i am \u00eencredere c\u0103 vei sluji cu curaj \
	Ordinul Spiral. Por\u021bile c\u0103tre Clockworks sunt chiar \u00een fa\u021b\u0103. \n\
	\n\
	Mult noroc!

r.arc_leader_5 = \u00cencheie conversa\u021bia
r.arc_leader_5_accept = S\u0103 ajung la Terminalul 1? M\u0103 ocup imediat!

# Wegner Basic
#...................................................................................................

n.arc_mintut = Wegner

m.arc_mintut_1 = Salut. Sunt Wegner, Cavalerul Geolog-\u0218ef al navei Skylark \u0219i coordonatorul \
	studiilor geologice din Clockworks.

r.arc_mintut_1 = Am venit s\u0103 \u00eenv\u0103\u021b despre mineralele care se g\u0103sesc \u00een Clockworks.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = \u00cen timpul c\u0103l\u0103toriilor tale prin Clockworks vei \u00eent\u00e2lni cinci minerale speciale: \
	crimsonit, piatr\u0103 lunar\u0103, valeston, luminite \u0219i materie \u00eentunecat\u0103.

r.arc_mintut_2 = Continu\u0103

# IMAGE: step2_gather.png
m.arc_mintut_3 = Vei g\u0103si z\u0103c\u0103minte de minereu la toate nivelurile din Clockworks. Trebuie s\u0103 le \
	ataci pentru a le sparge \u00een buc\u0103\u021bi suficient de mici \u00eenc\u00e2t s\u0103 le po\u021bi transporta. Po\u021bi ridica \
	doar unul odat\u0103, dar \u00eel po\u021bi schimba lu\u00e2nd altul. Caut\u0103-l pe cel mai mare \u0219i mai str\u0103lucitor. \
	Acestea sunt cele mai valoroase.

r.arc_mintut_3 = Continu\u0103

m.arc_mintut_4 = Dup\u0103 ce ajungi \u00een siguran\u021b\u0103 la lift, mineralul pe care \u00eel transpor\u021bi va fi \
	depozitat \u00een arsenalul t\u0103u pentru a-l folosi mai t\u00e2rziu. To\u021bi membrii grupului primesc \
	mineralele celorlal\u021bi, a\u0219a c\u0103 nu trebuie s\u0103 v\u0103 certa\u021bi pentru cel mai bun!

r.arc_mintut_4 = Continu\u0103

m.arc_mintut_5 = Mineralele sunt folosite pentru a crea hran\u0103 pentru spirite \u00een Laborator. \
	Aceast\u0103 hran\u0103 este foarte important\u0103 pentru dezvoltarea spiritului t\u0103u, a\u0219a c\u0103 nu rata \
	mineralele atunci c\u00e2nd le \u00eent\u00e2lne\u0219ti!

r.arc_mintut_5 = Continu\u0103

m.arc_mintut_6 = Cercet\u0103rile noastre geologice continu\u0103, a\u0219a c\u0103 este posibil s\u0103 descoperim \u0219i \
	alte utiliz\u0103ri fascinante pentru aceste minerale ciudate \u0219i puternice.

r.arc_mintut_6 = Sun\u0103 grozav! Mul\u021bumesc pentru informa\u021bii!

