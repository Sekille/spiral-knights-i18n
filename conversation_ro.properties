r.crucible_what = Spune-mi mai multe...
r.crucible_changes = Spune-mi despre Crucible.
r.crucible_ui = Arat\u0103-mi configura\u021bia Crucible.

m.crucible_intro2 = Kee kee! Regele Krogmo m-a pus s\u0103-l ajut la construirea unor arene \u00een trecut... \n\n\
                    Dar sunt curioas\u0103 s\u0103 v\u0103d de ce sunte\u021bi voi, cavalerii, \u00een stare. \n\n\
                    Coliseum Crucible este un program prin care \u00eei po\u021bi ajuta pe al\u021bi cavaleri \
                    s\u0103 dezvolte \u0219i s\u0103 testeze arene. \n\n\
                    Te intereseaz\u0103 s\u0103 participi?

r.crucible_yes = Da!
r.crucible_no = Poate mai t\u00e2rziu...
r.crucible_cant = Mai \u00eent\u00e2i trebuie s\u0103-mi \u00eenregistrez contul. M\u0103 voi \u00eentoarce.

m.crucible_intro3 = Bine, atunci va trebui s\u0103 fii de acord cu termenii \u0219i condi\u021biile. \
                    \n\n \
                    Trebuie s\u0103 fim aten\u021bi la toate detaliile, \u0219tii doar! Kee kee!

r.crucible_ok = Bine

m.crucible_changes = Arenele nou \u00eenc\u0103rcate sunt ini\u021bial private, dar exist\u0103 dou\u0103 zone pentru \
                     testarea public\u0103: un teren de joac\u0103, unde orice este permis, \u0219i o zon\u0103 \
                     pentru dezvolt\u0103ri mai serioase, orientate spre ob\u021binerea aprob\u0103rii oficiale.\n\n \
                     Doar arenele care ob\u021bin un rating suficient de bun pot fi trimise spre \
                     aprobare.


