n.biscotti = Biscotti

m.biscotti_1 = Salut! Sunt Biscotti, Buc\u0103tarul-\u0218ef al navei Skylark! Avem o mic\u0103 problem\u0103 \
	care s-ar putea sau nu s\u0103 implice ni\u0219te pr\u0103jituri monstruoase \u0219i inteligente, care s-ar \
	putea s\u0103-mi fi ocupat complet buc\u0103t\u0103ria \u0219i s\u0103 fi infestat Clockworks... \n\
	\n\
	Oricum, am \u00eencheiat o \u00een\u021belegere cu Str\u0103inii: vor oferi recompense celor care aduc felii \
	de pr\u0103jitur\u0103 ce dovedesc c\u0103 au ajutat la exterminarea acestor mon\u0219tri \u00eengrozitori, care \
	s-ar putea sau nu s\u0103 existe.

