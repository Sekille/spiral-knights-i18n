r.monster_codex = \u00cenchide codexul

n.monster_codex_trojan = Codexul Mon\u0219trilor:
m.monster_codex_trojan = Trojan \
  \n\
  Ace\u0219ti leviatani uria\u0219i sunt invulnerabili din fa\u021b\u0103. Love\u0219te cristalul de pe spatele lor \
  pentru a-i pune la p\u0103m\u00e2nt.
# IMAGE: codex_trojan.png

n.monster_codex_zombie = Codexul Mon\u0219trilor:
m.monster_codex_zombie = Zombi \
  \n\
  Zombii care se t\u00e2r\u0103sc se vor ridica din mor\u021bi dac\u0103 sunt uci\u0219i l\u00e2ng\u0103 un Totem Funest. \
  Atrage-i departe de acesta pentru a le putea oferi odihna ve\u0219nic\u0103.
# IMAGE: codex_zombie.png

n.monster_codex_devilites = Codexul Mon\u0219trilor:
m.monster_codex_devilites = Devilites \
  \n\
  Devilites sunt muncitorii de baz\u0103 ai lumii subterane. Dac\u0103 un \u0218ef al Gropii prinde un Devilite \
  st\u00e2nd degeaba, \u00eel poate promova la rangul de Overtimer furios sau de Yesman docil.
# IMAGE: codex_devilites.png

n.monster_codex_snarbolax = Codexul Mon\u0219trilor:
m.monster_codex_snarbolax = Snarbolax \
  \n\
  Miticul Snarbolax este imun la atacurile cavalerilor. Dac\u0103 sun\u0103 Clopotul Bestiei atunci c\u00e2nd \
  creatura se afl\u0103 \u00een apropiere, aceasta va fi ame\u021bit\u0103 \u0219i adus\u0103 \u00een stare de supunere.
# IMAGE: codex_snarbolax.png

n.monster_codex_royal_jelly = Codexul Mon\u0219trilor:
m.monster_codex_royal_jelly = Royal Jelly \
  \n\
  Acest cub gelatinos uria\u0219 \u00ee\u0219i pierde repede r\u0103bdarea \u0219i ador\u0103 s\u0103-\u0219i impun\u0103 for\u021ba. C\u00e2nd \
  degust\u0103torii s\u0103i regali lipsesc, un desert otr\u0103vit \u00eei poate da mari b\u0103t\u0103i de cap.
# IMAGE: codex_royal_jelly.png

n.monster_codex_roarmulus_twins = Codexul Mon\u0219trilor:
m.monster_codex_roarmulus_twins = Gemenii Roarmulus \
  \n\
  Ace\u0219ti c\u0103\u021bei uria\u0219i \u00eenarma\u021bi au armur\u0103 impenetrabil\u0103 \u0219i muni\u021bie extrem de puternic\u0103. Pielea \
  lor este at\u00e2t de groas\u0103, \u00eenc\u00e2t pot fi r\u0103ni\u021bi doar de focul fra\u021bilor lor.
# IMAGE: codex_roarmulus_twins.png

n.monster_codex_vanaduke = Codexul Mon\u0219trilor:
m.monster_codex_vanaduke = Lordul Vanaduke \
  \n\
  Se cunosc foarte pu\u021bine lucruri despre Ducele etern al Imperiului Almirian. Senzorii no\u0219tri \
  arat\u0103 c\u0103 masca este at\u00e2t o surs\u0103 de putere, c\u00e2t \u0219i o posibil\u0103 sl\u0103biciune.
# IMAGE: codex_vanaduke.png

n.monster_codex_battlepod = Codexul Mon\u0219trilor:
m.monster_codex_battlepod = Battlepod \
  \n\
  Ace\u0219ti robo\u021bi imobili ascund un mic arsenal sub armura lor cu blindaj dublu. Fiecare Battlepod \
  are o combina\u021bie unic\u0103 de atacuri \u0219i ap\u0103r\u0103ri, a\u0219a c\u0103 trebuie s\u0103 fii mereu preg\u0103tit pentru \
  surprize.
# IMAGE: codex_battlepod.png

