n.mon_pocket = Nonna

m.mon_pocket_1 = Salut\u0103ri! Sunt Nonna, de la Agen\u021bia de Adop\u021bie Emberlight! \n\n\
	Noi, cei de la Agen\u021bia de Adop\u021bie Emberlight, adun\u0103m pui de mon\u0219tri care s-au r\u0103t\u0103cit \u00een \
	cele mai \u00eentunecate ad\u00e2ncuri ale Clockworks. R\u0103ma\u0219i f\u0103r\u0103 cas\u0103 \u0219i f\u0103r\u0103 nicio posibilitate \
	de a se \u00eengriji singuri, \u00eencerc\u0103m s\u0103 le g\u0103sim acestor micu\u021be creaturi o cas\u0103 bun\u0103! \n\n\
	Cump\u0103r\u00e2nd unul dintre ace\u0219ti adorabili \u201emon\u0219tri de buzunar\u201d, vei putea purta cu tine propriul \
	pui de monstru! \n\n\
	Agen\u021bia de Adop\u021bie Emberlight va vizita Haven din c\u00e2nd \u00een c\u00e2nd \u0219i nu \u0219tii niciodat\u0103 ce \
	creaturi vom avea de oferit!

r.mon_pocket_1 = Arat\u0103-mi cine este disponibil pentru adop\u021bie!

r.mon_pocket_2 = Mul\u021bumesc, Nonna, poate data viitoare.


# Shadow Lair Warden
#...................................................................................................

n.sl_guard = Gardianul Spiral

m.sl_guard_1 = Salut\u0103ri, cavalerule. \u00cen fa\u021ba ta se afl\u0103 lifturile care duc c\u0103tre ceea ce \
	Cartierul General Spiral nume\u0219te \u201eB\u00e2rlogurile Umbrelor\u201d. Acestea ad\u0103postesc unii dintre \
	cei mai puternici mon\u0219tri din Clockworks, a\u0219a c\u0103 asigur\u0103-te c\u0103 ai echipament complet de \
	Tier 3 \u00eenainte s\u0103 mergi mai departe.

r.sl_guard_1 = Continu\u0103

m.sl_guard_2 = Cavalerii de recunoa\u0219tere care au explorat aceste lumi noi \u0219i ciudate spun c\u0103 \
	simt o \u00eentunecime \u00eensp\u0103im\u00e2nt\u0103toare \u00eenv\u0103luindu-i la fiecare pas. Se \u00eent\u00e2mpl\u0103 ceva neobi\u0219nuit \
	aici \u0219i avem nevoie de cei mai de elit\u0103 cavaleri ai no\u0219tri pentru a investiga.

r.sl_guard_2 = Am \u00een\u021beles. De ce altceva mai am nevoie?

m.sl_guard_3 = Toate B\u00e2rlogurile Umbrelor sunt \u00eencuiate cu un mecanism ciudat, care poate fi \
	deblocat doar cu o \u201eCheie a Umbrei\u201d. Cheile Umbrei pot fi cump\u0103rate din Depozitul de Provizii. \n\
	\n\
	Dup\u0103 ce un membru al grupului folose\u0219te o Cheie a Umbrei, componen\u021ba grupului este blocat\u0103 \
	\u0219i nu mai poate fi schimbat\u0103. A\u0219adar, alege-\u021bi cu grij\u0103 coechipierii!

r.sl_guard_3 = Voi ob\u021bine o Cheie a Umbrei \u0219i voi \u00eencepe investiga\u021bia!

m.sl_guard_4 = Atunci \u00ee\u021bi doresc mult noroc. B\u00e2rlogurile Umbrelor vor fi cea mai mare provocare \
	pe care ai \u00eent\u00e2lnit-o p\u00e2n\u0103 acum.

r.sl_guard_4 = \u00cencheie conversa\u021bia


