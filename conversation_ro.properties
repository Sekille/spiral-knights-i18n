## GENERAL

m.please_wait = V\u0103 rug\u0103m s\u0103 a\u0219tepta\u021bi
m.exit_marker = Ie\u0219ire

# Energy Info
#...................................................................................................

n.energy_info = Cavalerul Energetic

m.energy_info_1a = \u0218tii care este cea mai important\u0103 resurs\u0103 de pe Cradle? ENERGIA! Exact! \
	prietene, este at\u00e2t de special\u0103 \u00eenc\u00e2t merit\u0103 s\u0103 strig\u0103m despre ea! Vrei s\u0103 afli mai multe \
	despre aceast\u0103 resurs\u0103 extrem de important\u0103? Se \u00eent\u00e2mpl\u0103 s\u0103 fiu un expert \u00een domeniu!

r.energy_info_1a = Se pare c\u0103 ar trebui s\u0103 \u0219tiu toate acestea. Spune-mi mai multe!

r.energy_info_1b = Nu, mul\u021bumesc. Prefer s\u0103 r\u0103m\u00e2n ne\u0219tiutor \u00een privin\u021ba unui lucru at\u00e2t de uimitor.

m.energy_info_2a = Minunat! \u00ce\u021bi voi explica totul \u00een trei lec\u021bii simple: ce este energia, cum \
	este folosit\u0103 \u0219i cum po\u021bi ob\u021bine mai mult\u0103.

r.energy_info_2a = Ce este energia?

r.energy_info_2b = Cum este folosit\u0103 energia?

r.energy_info_2c = Cum pot ob\u021bine mai mult\u0103 energie?

r.energy_info_2d = Lec\u021biile tale m-au energizat! Pornesc \u00een aventur\u0103. Pe cur\u00e2nd!

m.energy_info_3a = Energia este o putere foarte special\u0103 care eman\u0103 \u00een permanen\u021b\u0103 din nucleul \
	 acestei lumi. Este complet stabil\u0103 \u0219i nu se pierde niciodat\u0103, dec\u00e2t dac\u0103 este tranzac\u021bionat\u0103 \
	 sau cheltuit\u0103. (Po\u021bi vedea c\u00e2t\u0103 energie ai \u00een modulul de energie din arsenalul t\u0103u.)

m.energy_info_3b = Energia este folosit\u0103 pentru tot felul de lucruri! Este principala moned\u0103 \
	pentru cump\u0103rarea bunurilor din Depozitul de Provizii, \u00ee\u021bi permite s\u0103-\u021bi achizi\u021bionezi \
	\u00eembun\u0103t\u0103\u021biri, s\u0103 te re\u00eenvii \u00een Clockworks atunci c\u00e2nd r\u0103m\u00e2i f\u0103r\u0103 Sc\u00e2ntei de Via\u021b\u0103 \u0219i este \
	necesar\u0103 pentru \u00eenfiin\u021barea unei ghilde. \n\
	\n\
	De asemenea, vei g\u0103si \u00een lume tot felul de dispozitive alimentate cu energie. Caut\u0103 simbolul \
	albastru al energiei de pe dispozitiv.

m.energy_info_3c = Energia poate fi ob\u021binut\u0103 doar prin cump\u0103rare cu bani reali sau prin \
	tranzac\u021bionare la Burs\u0103. Pentru a cump\u0103ra sau a tranzac\u021biona energie, deschide Depozitul de \
	Provizii \u0219i apas\u0103 butonul \u201eOb\u021bine energie\u201d.

r.energy_info_3a = Mai am o \u00eentrebare pentru tine.

r.energy_info_3b = Lec\u021biile tale m-au energizat! Pornesc \u00een aventur\u0103. Pe cur\u00e2nd!



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Agent de salvare

m.tut_intro_1a = Bine ai venit pe Cradle, recrutule! M\u0103 bucur \u00eentotdeauna s\u0103 v\u0103d un cavaler \
	supravie\u021buind unei c\u0103deri \u00eentreg \u0219i nev\u0103t\u0103mat. Avem o tab\u0103r\u0103 de salvare nu departe de pozi\u021bia \
	ta. Te voi conduce acolo, dar preg\u0103te\u0219te-\u021bi sabia: drumul din fa\u021b\u0103 este plin de inamici!\n\

r.tut_intro_1a = Am \u00een\u021beles! Pornesc \u00eentr-acolo!

n.tut_intro2 = Rhendon

m.tut_intro2_1a = ...r\u0103spunde, {0}, m\u0103 auzi? Aici Cavalerul de Recunoa\u0219tere Rhendon!

r.tut_intro2_1a = Sunt aici. Ce s-a \u00eent\u00e2mplat?

m.tut_intro2_2a = Tocmai ai ajuns la suprafa\u021ba planetei Cradle. Capsula mea de evacuare s-a \
	pr\u0103bu\u0219it pu\u021bin la nord de pozi\u021bia ta. Ar trebui s\u0103 ne \u00eent\u00e2lnim \u0219i s\u0103 g\u0103sim cel mai apropiat \
	punct de adunare. \n\
	\n\
	Ai grij\u0103 \u0219i preg\u0103te\u0219te-\u021bi sabia. Creaturi ostile sunt peste tot!

r.tut_intro2_2a = Am \u00een\u021beles, Rhendon. Vin spre tine!

n.tut_intro3 = Rhendon

m.tut_intro3_1a = {0}! Ce bine \u00eemi pare s\u0103 te v\u0103d! Locul acesta este at\u00e2t de straniu. M\u0103 bucur \
	s\u0103 v\u0103d o fa\u021b\u0103 cunoscut\u0103 \u0219i nu \u00eenc\u0103 un inamic.

r.tut_intro3_1a = \u0218i eu m\u0103 bucur s\u0103 te v\u0103d teaf\u0103r, Rhendon. Unde sunt ceilal\u021bi supravie\u021buitori?

m.tut_intro3_2a = Am stabilit o leg\u0103tur\u0103 de comunica\u021bie cu ni\u0219te cavaleri care au \u00eenfiin\u021bat o \
	tab\u0103r\u0103 de salvare mai \u00een fa\u021b\u0103. Dac\u0103 mergi spre nord, ar trebui s\u0103 ajungi la ea. \n\
	\n\
	Eu voi r\u0103m\u00e2ne aici deocamdat\u0103 \u0219i voi \u00eencerca s\u0103 g\u0103sesc al\u021bi cavaleri care s-au pr\u0103bu\u0219it \u00een \
	zon\u0103. Ne vom \u00eent\u00e2lni la tab\u0103ra de salvare \u00eenainte de apus. \n\
	\n\
	\u0218i dac\u0103 \u00eent\u00e2lne\u0219ti ceva cu adev\u0103rat periculos, apas\u0103 [[?DEFEND]] pentru a-\u021bi folosi scutul!

r.tut_intro3_2a = Atunci voi cerceta drumul din fa\u021b\u0103! Ai grij\u0103, Rhendon.

n.tut_intro4 = Rhendon
m.tut_intro4_1a = Voi r\u0103m\u00e2ne aici deocamdat\u0103 \u0219i voi \u00eencerca s\u0103 g\u0103sesc al\u021bi cavaleri care s-au \
	pr\u0103bu\u0219it \u00een zon\u0103. Ne vom \u00eent\u00e2lni la tab\u0103ra de salvare din nord. \n\
	\n\
	Iar dac\u0103 \u00eent\u00e2lne\u0219ti ceva cu adev\u0103rat periculos, apas\u0103 [[?DEFEND]] pentru a-\u021bi folosi scutul!

r.tut_intro4_1a = Atunci voi cerceta drumul din fa\u021b\u0103! Ai grij\u0103, Rhendon.

m.tut_intro3_3a = Mult noroc!
m.tut_intro3_3b = Ai grij\u0103!
m.tut_intro3_3c = Nu uita, apas\u0103 [[?DEFEND]] pentru a-\u021bi folosi scutul!

# Warden Companion
#.................................................................................................
n.tut_warden = Gardianul Spiral

m.tut_warden_1a = Salutare, cavaler. Tu trebuie s\u0103 fii {0}. Rhendon ne-a transmis prin radio c\u0103 \
	te \u00eendrep\u021bi spre noi. Vino cu noi, tab\u0103ra de salvare este chiar \u00een fa\u021b\u0103.

r.tut_warden_1a = Minunat! Abia a\u0219tept o mas\u0103 cald\u0103.

m.tut_warden_2a = \u0218i eu la fel. Acum, s\u0103 mergem... \n\
	\n\
	Stai pu\u021bin, ceva nu este \u00een regul\u0103. Preg\u0103te\u0219te-te, cred c\u0103 avem musafiri!

r.tut_warden_2a = \u00cencheie conversa\u021bia

m.tut_warden_3a = Foarte bine, {0}! Se pare c\u0103 te descurci pe c\u00e2mpul de lupt\u0103. \n\
	\n\
	Haide, s\u0103 mergem \u00een tab\u0103r\u0103. Poate ne po\u021bi ajuta s\u0103 \u00een\u021belegem ce naiba se \u00eent\u00e2mpl\u0103 aici.

r.tut_warden_3a = \u00cencheie conversa\u021bia

# Final Test Knight
#...................................................................................................

n.final_test_knight = Feron

m.final_test_knight_1a = Uimitor! Nu m-a\u0219 fi a\u0219teptat niciodat\u0103 ca un recrut nou s\u0103 ias\u0103 viu \
	din epava aceea \u00een fl\u0103c\u0103ri! Trebuie s\u0103 fii cu adev\u0103rat remarcabil... \n\
	\n\
	Numele meu este Feron, locotenent al Ordinului Spiral. Credeam c\u0103 \u00eentregul complex era \
	abandonat, p\u00e2n\u0103 c\u00e2nd liftul care ducea aici s-a activat brusc. C\u00e2nd am venit s\u0103 investig\u0103m, \
	\u00eentregul loc a fost cuprins de fl\u0103c\u0103ri! \n\
	\n\
	Cum ai ajuns aici?

r.final_test_knight_1a = (Poveste\u0219te-i lui Feron despre tab\u0103ra de salvare, Razwog \u0219i Artefact)

m.final_test_knight_2a = \u00cen\u021beleg. Aceste informa\u021bii vor fi foarte interesante pentru Cartierul \
	General Spiral. Tab\u0103ra noastr\u0103 de baz\u0103 din Haven este chiar \u00een fa\u021b\u0103. Urc\u0103 \u00een lift \u0219i \
	\u00eent\u00e2lne\u0219te-i pe ceilal\u021bi cavaleri care au supravie\u021buit pr\u0103bu\u0219irii, la fel ca tine. Tehnicienii \
	din Laborator vor fi ner\u0103bd\u0103tori s\u0103 studieze acel artefact. Se vor ocupa de el dup\u0103 ce ajungi \
	\u00een Haven. \n\
	\n\
	Nu-\u021bi face griji pentru ceilal\u021bi din tab\u0103ra de salvare. Datorit\u0103 \u021bie, avem acum un sistem de \
	lifturi func\u021bional pentru a ajunge la ei. I-ai salvat pe to\u021bi!

r.final_test_knight_2a = Mul\u021bumesc, locotenente. Voi merge \u00een Haven.

# Rescued Stranger
#...................................................................................................

n.rescued_stranger = Keepoh

m.rescued_stranger_1a = Salutare, micu\u021bule. Vei descoperi c\u0103 aceast\u0103 lume nou\u0103 este plin\u0103 de \
	pericole, dar \u0219i de oportunit\u0103\u021bi pentru cei aventuro\u0219i \u0219i curajo\u0219i! Unul dintre semenii t\u0103i \
	te a\u0219teapt\u0103 pu\u021bin mai sus pe potec\u0103. Cu siguran\u021b\u0103 ne vom revedea. Deocamdat\u0103, r\u0103mas-bun!

r.rescued_stranger_1a = \u00cencheie conversa\u021bia


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

n.rc_greet2 = Greta

m.rc_greet2_1a = Salut\u0103ri! Sunt Greta, conduc\u0103toarea echipei. Tu trebuie s\u0103 fii {0}. Rhendon \
	ne-a spus c\u0103 ar trebui s\u0103 te a\u0219tept\u0103m, \u0219i ai ajuns chiar la timp. Tab\u0103ra aceasta de salvare \
	se confrunt\u0103 cu o criz\u0103.

r.rc_greet2_1a = Care este problema, Greta?

m.rc_greet2_2a = Pe scurt, tab\u0103ra nu are curent electric, iar soarele apune \u00een cur\u00e2nd. Noaptea \
	trecut\u0103, tot felul de mon\u0219tri \u00eengrozitori ne-au atacat \u00een \u00eentuneric. Nu vedeam nimic \u0219i \
	turelele noastre defensive nu aveau energie. \n\
	\n\
	...am pierdut mul\u021bi recru\u021bi. \n\
	\n\
	Trebuie s\u0103 redirec\u021bion\u0103m energia c\u0103tre tab\u0103ra de salvare, ca s\u0103 putem instala un perimetru \
	defensiv \u00eenainte de l\u0103sarea nop\u021bii!

r.rc_greet2_2a = Cum pot ajuta la redirec\u021bionarea energiei c\u0103tre tab\u0103r\u0103?

m.rc_greet2_3a = Scan\u0103rile noastre au detectat un generator antic sub aceast\u0103 tab\u0103r\u0103. Ar trebui \
	s\u0103 trimit\u0103 energie la suprafa\u021b\u0103, dar ceva pare s\u0103 o devieze. \n\
	\n\
	Avem nevoie s\u0103 investighezi generatorul antic \u0219i s\u0103 redirec\u021bionezi energia \u00eenapoi spre \
	suprafa\u021b\u0103. Dar trebuie s\u0103 fii preg\u0103tit: zona nu a fost explorat\u0103 deloc \u0219i este plin\u0103 de \
	mon\u0219tri. \n\
	\n\
	Rhendon a spus c\u0103 vrea s\u0103 se \u00eent\u00e2lneasc\u0103 cu tine \u00eenainte s\u0103 porne\u0219ti \u00een aceast\u0103 misiune. \
	De ce nu te duci mai \u00eent\u00e2i s\u0103-l vezi?

r.rc_greet2_3a = M\u0103 voi \u00eent\u00e2lni cu Rhendon \u00eenainte s\u0103 investighez generatorul.

m.rc_greet2_4a = Te rog, {0}, ajut\u0103-ne s\u0103 restabilim alimentarea cu energie a taberei de \
	salvare, ca s\u0103 putem instala un perimetru defensiv. Nu ne mai putem permite s\u0103 pierdem al\u021bi \
	recru\u021bi din cauza creaturilor nop\u021bii!

r.rc_greet2_4a = Voi face tot ce pot!

m.rc_greet3_1a = Ai restabilit alimentarea cu energie \u0219i ne-ai salvat pe to\u021bi, {0}! Nu-\u021bi pot \
	mul\u021bumi \u00eendeajuns. To\u021bi recru\u021bii ace\u0219tia \u00ee\u021bi datoreaz\u0103 via\u021ba. \n\
	\n\
	Acum ar trebui s\u0103 \u00eencerci s\u0103 contactezi Cartierul General Spiral prin leg\u0103tura ta de comunica\u021bie.

r.rc_greet3_1a = \u00cencheie conversa\u021bia

# Rescue Camp Recruit Knights
#...................................................................................................

n.rc_recruit = Recrut

m.rc_recruit_a = Poate c\u0103 nu avem curent electric, dar m\u0103car pot aprinde un foc ca s\u0103 avem \
	pu\u021bin\u0103 lumin\u0103 \u00een seara asta.

m.rc_recruit_b = Nu am reu\u0219it s\u0103 recuper\u0103m prea mult echipament din capsulele pr\u0103bu\u0219ite. Nu avem \
	nici m\u0103car suficient pentru fiecare cavaler apt de lupt\u0103.

m.rc_recruit_c = \u00ce\u021bi vine s\u0103 crezi? \u00centreaga pr\u0103pastie este umplut\u0103 de un fel de ma\u0219in\u0103rie uria\u0219\u0103. \
	Parc\u0103 nu s-ar mai termina niciodat\u0103. \n\
	\n\
	M\u0103 \u00eentreb dac\u0103 \u00eentreaga planet\u0103 este construit\u0103 a\u0219a?

m.rc_recruit_d = Cu c\u0103ldura focului \u0219i protec\u021bia turelelor defensive, cred c\u0103 voi dormi bine \
	la noapte.

m.rc_recruit_e = Simt electricitatea \u00een aer! Se pare c\u0103 nu va mai trebui s\u0103 ne ap\u0103r\u0103m cu \
	ultimele puteri \u00een seara asta!

m.rc_recruit_f = Am auzit c\u0103 vei cobor\u00ee cu liftul \u00een pr\u0103pastia de dedesubt. E\u0219ti mult mai \
	curajos dec\u00e2t mine...

r.rc_recruit = \u00cencheie conversa\u021bia

# Technician Knight
#...................................................................................................

n.rc_technician = Tehnician

m.rc_technician_a = Conform acestor scan\u0103ri, ar trebui s\u0103 existe o surs\u0103 de energie undeva \u00een \
	ad\u00e2ncurile de sub tab\u0103r\u0103, dar energia este deviat\u0103 \u00eentr-un fel...

m.rc_technician_b = Dispozitivul acesta este inutil f\u0103r\u0103 energie. Cum ar trebui s\u0103 ne ap\u0103r\u0103m \
	de mon\u0219trii aceia?!

m.rc_technician_c = Energia a revenit \u00een for\u021b\u0103 \u00een tab\u0103r\u0103! Ai reu\u0219it, {0}!

r.rc_technician = \u00cencheie conversa\u021bia

# Injured Knight
#...................................................................................................

n.rc_injured = Cavaler r\u0103nit

m.rc_injured_a = Noaptea trecut\u0103, mon\u0219tri \u00eengrozitori ne-au atacat \u00een \u00eentuneric. A fost un haos \
	total. F\u0103r\u0103 energie pentru turele, nu am avut cum s\u0103 ne ap\u0103r\u0103m. \n\
	\n\
	At\u00e2\u021bia cavaleri curajo\u0219i au pierit...

m.rc_injured_b = Unul dintre mon\u0219trii mecanici m-a prins. Ghearele blestemate ale creaturii \
	mi-au sf\u00e2\u0219iat armura!

m.rc_injured_c = Datorit\u0103 \u021bie, nu va mai trebui s\u0103 \u00eenfrunt\u0103m o alt\u0103 noapte ca aceea...

m.rc_injured_d = Dup\u0103 restabilirea aliment\u0103rii cu energie, am reu\u0219it s\u0103-mi repar armura. \
	Sper s\u0103 nu mai dau peste prea multe dintre acele epave monstruoase!

r.rc_injured = \u00cencheie conversa\u021bia

# Nervous Knight
#...................................................................................................

n.rc_nervous = Cavalerul nelini\u0219tit

m.rc_nervous_1a = Vreau s\u0103 cump\u0103r ceva cu coroanele pe care le-am c\u00e2\u0219tigat \u00een terenul de \
	antrenament, dar negustorul acela \u00eemi d\u0103 fiori. Ce crezi c\u0103 ascunde sub robe?!

r.rc_nervous_1a = \u00cencheie conversa\u021bia

# Forge Knight
#...................................................................................................

n.rc_forge = Cavalerul Forjei

m.forge_knight_1a = Cradle este o lume periculoas\u0103 \u0219i este important s\u0103 te asiguri c\u0103 ai \
	echipament puternic \u00een arsenal pentru a supravie\u021bui. Pentru asta, va trebui s\u0103 folose\u0219ti Forja.

r.forge_knight_1a = Ce este Forja?

m.forge_knight_2a = Forja folose\u0219te c\u0103ldura stocat\u0103 \u00een echipamentul t\u0103u \u0219i o combin\u0103 cu puterea \
	Cristalelor de Foc pentru a-i debloca poten\u021bialul.

r.forge_knight_2a = Continu\u0103

m.forge_knight_3a = \u00cen ora\u0219, po\u021bi accesa Forja oric\u00e2nd. \u00cen Clockworks, o po\u021bi accesa folosind \
	o Sta\u021bie de Arsenal.

r.forge_knight_3a = Continu\u0103

m.forge_knight_4a = C\u00e2nd folose\u0219ti Forja, vei vedea o list\u0103 cu toate obiectele preg\u0103tite pentru \
	cre\u0219terea nivelului. Selectarea unui obiect \u00ee\u021bi va ar\u0103ta cum poate fi \u00eembun\u0103t\u0103\u021bit.

r.forge_knight_4a = Continu\u0103

m.forge_knight_5a = Fiecare obiect necesit\u0103 un anumit tip de Cristal de Foc. Cristalele de Foc \
	pot fi ob\u021binute din Depozitul de Provizii, c\u00e2\u0219tigate prin finalizarea anumitor misiuni \u0219i \
	g\u0103site \u00een blocurile cu comori din Clockworks!

r.forge_knight_5a = Cum func\u021bioneaz\u0103 Cristalele de Foc?

m.forge_knight_6a = Cristalele de Foc sunt oarecum instabile, iar cantitatea necesar\u0103 pentru \
	o forjare reu\u0219it\u0103 variaz\u0103. \n\
	De asemenea, am descoperit c\u0103 folosirea unui num\u0103r mai mare de Cristale de Foc \u00ee\u021bi ofer\u0103 \
	\u0219ansa de a ob\u021bine bonusuri speciale care vor fi aplicate obiectului! \n\

r.forge_knight_6a = Sun\u0103 grozav!

m.forge_knight_7a = Acum c\u0103 \u0219tii despre Forj\u0103, ai vrea s\u0103 arunci o privire?

r.forge_knight_7a = Sigur! (Deschide Forja)
r.forge_knight_7b = M\u0103 voi uita mai t\u00e2rziu. (\u00cencheie conversa\u021bia)

# Geo Knight
#...................................................................................................

n.rc_soil = Cavaler geolog

m.rc_soil_1a = Colectez mostre geologice pentru Cartierul General Spiral. P\u00e2n\u0103 acum, testele \
	arat\u0103 c\u0103 exist\u0103 sute de tipuri unice de sol \u00een fiecare centimetru de sub picioarele noastre. \
	A\u0219a ceva nu este posibil. Trebuie s\u0103 fi calculat gre\u0219it...

r.rc_soil_1a = \u00cencheie conversa\u021bia

# Veteran Knights
#...................................................................................................

n.rc_vet_1 = Gardianul Spiral
n.rc_vet_2 = Cavaler veteran

m.rc_vet_1a = Mul\u021bumesc pentru ajutorul de mai devreme. Ai grij\u0103 de tine!
m.rc_vet_2a = Fii mereu \u00een gard\u0103. Cine \u0219tie ce alte pericole ne a\u0219teapt\u0103 \u00een aceast\u0103 lume?
m.rc_vet_3a = Nu m\u0103 voi putea lini\u0219ti p\u00e2n\u0103 nu vom lua leg\u0103tura cu Cartierul General Spiral.

r.rc_vet_1a = \u00cencheie conversa\u021bia

# Rhendon
#...................................................................................................

n.rc_rhendon = Rhendon

m.rc_rhendon_1a = Ce crezi c\u0103 este chestia asta, {0}? Trebuie s\u0103 fie important\u0103, dac\u0103 tipul \
	acela, Razwog, s-a \u00eenfuriat at\u00e2t de tare c\u00e2nd ai luat-o. \n\
	\n\
	A\u0219a-i trebuie pentru c\u0103 a \u00eencercat s\u0103 te omoare!

r.rc_rhendon_1a = \u00cencheie conversa\u021bia

# Kinter
#...................................................................................................

n.rc_instruct = Kinter

m.rc_instruct_1a = Salut\u0103ri, recrutule. M\u0103 bucur \u00eentotdeauna s\u0103 v\u0103d un alt cavaler ajung\u00e2nd \
	\u00een tab\u0103ra de salvare. B\u0103nuiesc c\u0103 vrei s\u0103 te preg\u0103te\u0219ti pentru c\u0103l\u0103toria spre Haven. Un loc \
	bun de \u00eenceput este poarta de aici, care duce \u00een Clockworks. Apropie-te pur \u0219i simplu de \
	panoul de control de la cap\u0103tul nordic al liftului \u0219i apas\u0103 butonul de ac\u021biune ([[?ACTION]]).\n\
	\n\
	Ai \u00eentreb\u0103ri?

r.rc_instruct_1a = \u00centreb\u0103ri? \u0218i \u00eenc\u0103 c\u00e2te!

r.rc_instruct_1b = N-am \u00eentreb\u0103ri, doar fapte. Am plecat!

m.rc_instruct_2a = Ce ai dori s\u0103 afli?

r.rc_instruct_2a = \u201eClockworks\u201d?

r.rc_instruct_2b = Ai spus ceva despre o \u201epoart\u0103\u201d?

r.rc_instruct_2c = M-am r\u0103zg\u00e2ndit. Pornesc la drum.

m.rc_instruct_3a = Clockworks este un complex uria\u0219 de ro\u021bi din\u021bate \u0219i mecanisme, situat \
	chiar sub suprafa\u021ba acestei lumi. Este cu adev\u0103rat o priveli\u0219te incredibil\u0103. Ne afl\u0103m \u00eentr-o \
	lume ciudat\u0103 \u0219i periculoas\u0103. Fii prudent.

m.rc_instruct_3b = O \u201epoart\u0103\u201d este un punct de intrare \u00een Clockworks. Acestea au forma \
	lifturilor pe care le vezi \u00een fa\u021ba ta. Fiecare poart\u0103 are un monitor care afi\u0219eaz\u0103 simbolul \
	s\u0103u unic, precum \u0219i un panou de control care permite accesul. Poarta aceasta te va duce \
	\u00eentotdeauna \u00een acela\u0219i loc, dar alte por\u021bi au etaje care se schimb\u0103 sub ele. \u00cen acelea, \
	nu \u0219tii niciodat\u0103 ce te a\u0219teapt\u0103!

r.rc_instruct_3a = Mai am o \u00eentrebare.

r.rc_instruct_3b = Mul\u021bumesc pentru informa\u021bii. Acum am plecat.

# Boomer
#...................................................................................................

n.rc_bomb = Boomer

m.rc_bomb_1a = Ai avut ocazia s\u0103 \u00eencerci bombele? Spre deosebire de alte tipuri de arme, \
	bombele pot fi folosite doar printr-un atac \u00eenc\u0103rcat. Orice altceva le face s\u0103 se sting\u0103 \
	f\u0103r\u0103 efect. Dar dac\u0103 le \u00eencarci... BOOM! Pot provoca daune serioase mai multor mon\u0219tri \
	deodat\u0103!

r.rc_bomb_1a = Sun\u0103 exploziv! Poate voi cump\u0103ra c\u00e2teva de la negustorul ambulant.

# Cautious Knight
#...................................................................................................

n.rc_warning = Cavalerul precaut

m.rc_warning_1a = \u00cen capul acestor sc\u0103ri se afl\u0103 poarta spre Haven. Asigur\u0103-te c\u0103 vorbe\u0219ti \
	cu Virgil \u00eenainte s\u0103 intri, ca s\u0103 \u0219tii la ce s\u0103 te a\u0219tep\u021bi.

r.rc_warning_1a = Am \u00een\u021beles. Voi asculta ce are Virgil de spus.

# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Cavalerul somnoros

m.rc_sleepy_1a = Antrenament... at\u00e2t de greu... trebuie doar s\u0103-mi odihnesc... ochii...

r.rc_sleepy_1a = \u00cencheie conversa\u021bia

# Virgil
#...................................................................................................

n.rc_end = Virgil

m.rc_virgil_1a = Ai grij\u0103 pe drumul din fa\u021b\u0103.

r.rc_virgil_1a = De ce?

m.rc_virgil_2a = Pasarela aceasta se \u00eentinde deasupra unei pr\u0103p\u0103stii uria\u0219e. Nu vreau s\u0103 fii \
	suflat de pe ea \u0219i s\u0103 cazi \u00een h\u0103ul de dedesubt.

r.rc_virgil_2a = Atunci de ce exist\u0103 pasarela aceasta?

m.rc_virgil_3a = Pare s\u0103 duc\u0103 la un fel de lift, dar f\u0103r\u0103 energie totul este complet nefunc\u021bional.

r.rc_virgil_3a = Voi fi atent.

m.rc_virgil_4a = Salutare, {0}. C\u00e2nd ai restabilit alimentarea cu energie a taberei, s-a pornit \
	\u0219i acest lift. Presupun c\u0103 te va duce ad\u00e2nc \u00een pr\u0103pastia de dedesubt, iar ce vei g\u0103si acolo \
	r\u0103m\u00e2ne un mister. \n\
	\n\
	Dac\u0103 inten\u021bionezi s\u0103 cobori \u00een acele ad\u00e2ncuri, asigur\u0103-te c\u0103 e\u0219ti preg\u0103tit s\u0103 \u00eenfrun\u021bi \
	orice te a\u0219teapt\u0103.

r.rc_virgil_4a = \u00cencheie conversa\u021bia

m.rc_end_1a = Aici este, recrutule. Aceasta este ultima poart\u0103 care duce \u00een afara taberei de \
	salvare, prin pr\u0103pastie \u0219i p\u00e2n\u0103 \u00een Haven. Dup\u0103 ce treci prin ea, nu va mai trebui s\u0103 te \
	\u00eentorci aici. Po\u021bi cump\u0103ra \u00een Haven tot ce g\u0103se\u0219ti \u00een tab\u0103ra de salvare \u0219i chiar mult mai mult. \n\
	\n\
	Ai \u00eentreb\u0103ri?

r.rc_end_1a = Da, a\u0219 vrea s\u0103 te \u00eentreb c\u00e2teva lucruri.

r.rc_end_1b = Am \u00een\u021beles pe deplin. Nu am \u00eentreb\u0103ri.

m.rc_end_2a = Cu ce te pot ajuta?

r.rc_end_2a = Odat\u0103 ce ajung \u00een Haven, chiar nu m\u0103 mai pot \u00eentoarce?

r.rc_end_2b = Ce fel de provoc\u0103ri m\u0103 a\u0219teapt\u0103 la ultima poart\u0103?

r.rc_end_2c = Ce ar trebui s\u0103 fac dup\u0103 ce ajung \u00een Haven?

r.rc_end_2d = Nu mai am alte \u00eentreb\u0103ri. Am plecat.

m.rc_end_3a = Nu, nu vei putea s\u0103 te \u00eentorci. Odat\u0103 ce ajungi \u00een Haven, antrenamentul t\u0103u va fi \
	\u00eencheiat, iar noul t\u0103u obiectiv va fi s\u0103-i aju\u021bi pe Cavalerii Spiral, care au acum baza \u00een Haven.

m.rc_end_3b = De\u0219i drumul este periculos, nu vei cobor\u00ee foarte ad\u00e2nc, a\u0219a c\u0103 mon\u0219trii pe care \
	\u00eei vei \u00eent\u00e2lni ar trebui s\u0103 fie destul de u\u0219or de \u00eenvins. Totu\u0219i, cerceta\u0219ii au raportat o \
	activitate tot mai intens\u0103 a gremlinilor \u00een zon\u0103 de c\u00e2nd am \u00eenfiin\u021bat tab\u0103ra. A\u0219a c\u0103 ai grij\u0103.

m.rc_end_3c = Odat\u0103 ajuns \u00een Haven, te sf\u0103tuiesc s\u0103 explorezi ora\u0219ul \u0219i s\u0103 te familiarizezi \
	cu toate locurile \u0219i serviciile pe care le ofer\u0103. Vei avea acces \u0219i la echipamente mai \
	puternice dec\u00e2t cele pe care le oferim aici \u0219i vei fi \u00eenconjurat de mult mai mul\u021bi cavaleri \
	experimenta\u021bi. Nu ezita s\u0103 le ceri ajutorul dac\u0103 te r\u0103t\u0103ce\u0219ti.

r.rc_end_3a = Mai am o \u00eentrebare.

r.rc_end_3b = \u00ce\u021bi mul\u021bumesc pentru ajutor. C\u00e2nd voi fi preg\u0103tit, voi trece prin ultima poart\u0103.

