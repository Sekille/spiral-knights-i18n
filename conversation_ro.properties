# Hunters Lodge
#...................................................................................................

n.hunter = Armero

m.hunter_1a = Salutare, drag\u0103 cavalerule! Sunt Armero, mare v\u00e2n\u0103tor al s\u0103lb\u0103ticiei \u0219i \
	administratorul acestei cabane prestigioase pe care o vezi \u00een fa\u021ba ta. \n\
	\n\
	Pe pere\u021bi se afl\u0103 c\u00e2teva dintre trofeele ob\u021binute \u00een numeroase expedi\u021bii curajoase, \u00een care \
	ne-am riscat via\u021ba \u0219i integritatea fizic\u0103 pentru a experimenta fiorul pur \u0219i ne\u00eembl\u00e2nzit \
	al v\u00e2n\u0103torii. \n\
	\n\
	Spune-mi, ai \u0219i tu aceea\u0219i pasiune? Aceea\u0219i atrac\u021bie pentru natur\u0103 \u0219i pericol?

r.hunter_1a = Am \u00eent\u00e2lnit destule pericole \u0219i \u00eemi plac.

m.hunter_2a = Minunat! Atunci poate c\u0103 tu \u0219i camarazii t\u0103i pute\u021bi fi de folos acestei cabane. \
	Vezi tu, ma\u0219ina de alchimie din fa\u021ba ta poate crea trofee magnifice de mon\u0219tri pentru \
	Sala Ghildei tale. \n\
	\n\
	Ma\u0219inile de alchimie folosesc materiale \u0219i coroane din Trezoreria Ghildei tale, iar \
	produsele rezultate sunt depuse tot acolo.

r.hunter_2a = Aha, deci este o munc\u0103 de echip\u0103?

m.hunter_3a = Exact! Trofeele de mon\u0219tri necesit\u0103 o cantitate mare de materiale, a\u0219a c\u0103 este \
	 firesc s\u0103 fie nevoie de efortul \u00eentregului grup. \n\
	\n\
	\u00cen cele din urm\u0103, unele dintre materialele de care vei avea nevoie pot fi ob\u021binute doar \
	cheltuind jetoane de \u0219ef la Brinks, \u00een Bazaar-ul din Haven. Acestea sunt dovada curajului \
	t\u0103u \u00een \u00eenfruntarea unor creaturi at\u00e2t de \u00eenfrico\u0219\u0103toare!

r.hunter_3a = Atunci v\u00e2n\u0103toarea poate \u00eencepe.

m.hunter_4a = A\u0219a te vreau! Arat\u0103-le mon\u0219trilor de ce e\u0219ti \u00een stare!

r.hunter_4a = \u00cencheie conversa\u021bia

# Monster Pockets
