n.dark_harvest_exp = Muerty

m.dark_harvest_exp = Bine ai venit la Festivalul Dark Harvest! Aceast\u0103 s\u0103rb\u0103toare anual\u0103 \
	onoreaz\u0103 mor\u021bii vii prin m\u0103\u0219ti festive, dulciuri delicioase \u0219i farse periculoase!\n\
	\n\
	Pentru a participa, exploreaz\u0103 Clockworks \u0219i \u00eencearc\u0103 s\u0103-l g\u0103se\u0219ti pe legendarul Punkin King. \
	Acest dovleac \u00eenfrico\u0219\u0103tor ofer\u0103 bomboane vizitatorilor. Po\u021bi schimba bomboanele cu m\u0103\u0219ti \
	de mon\u0219tri la negustorii din Pia\u021ba Central\u0103 din Haven!\n\
	\n\
	Dac\u0103 preferi o metod\u0103 mai direct\u0103 sau pur \u0219i simplu mai ai nevoie de c\u00e2teva bomboane, \
	negustorul nostru \u00ee\u021bi poate vinde \u0219i el.

r.dark_harvest_exp = Sun\u0103 distractiv! Pornesc \u00een c\u0103utarea lui Punkin King!


