m.crucible_intro1 = Salut\u0103ri!\n\n\
                    \u00cemi place foarte mult aici. Voi, cavalerii, m-a\u021bi primit foarte bine... \
                    M\u0103 simt \u00een siguran\u021b\u0103 aici.\n\n\
