# Desk Clerk
#...................................................................................................

n.deskclerk = Recep\u021bioner

m.deskclerk_1a = Bine ai venit la Conacul Moorcroft, unde spiritele obosite \u00ee\u0219i pot odihni \
	picioarele (dac\u0103 este cazul). Dac\u0103 inten\u021bionezi s\u0103 r\u0103m\u00e2i peste noapte, te rug\u0103m s\u0103 re\u021bii \
	c\u0103 vom face o mic\u0103 reamenajare a camerei tale o dat\u0103 la fiecare nou\u0103zeci \u0219i nou\u0103 de ani, \
	micul dejun continental este oferit din partea casei \u00een fiecare lun\u0103 plin\u0103, iar tu nu vei \
	mai putea p\u0103r\u0103si niciodat\u0103 acest loc. Bucur\u0103-te de \u0219edere!

r.deskclerk_1a = \u0102\u0103\u0103... Mul\u021bumesc?

n.moorcroft_archives = Pembrooke

m.moorcroft_archives_1a = Bine ai venit \u00een Arhivele Moorcroft, c\u0103l\u0103torule. Aici vei g\u0103si o \
	colec\u021bie impresionant\u0103 de grimorii antice din multe lumi uitate. Este o priveli\u0219te minunat\u0103, \
	nu-i a\u0219a? \n\
	\n\
	E\u0219ti liber s\u0103 te ui\u021bi \u00een jur, dar te rog s\u0103 nu atingi nimic. Unele dintre aceste c\u0103r\u021bi sunt \
	pline de puteri mistice incredibile. Te-ai putea r\u0103ni!

r.moorcroft_archives_1a = Mul\u021bumesc, voi avea grij\u0103.

m.moorcroft_archives_2a = Oh, {0}, este \u00eengrozitor, pur \u0219i simplu \u00eengrozitor! \n\
	\n\
	Un roi \u00eensp\u0103im\u00e2nt\u0103tor de kats negri a ie\u0219it dintr-un portal \u00eentunecat, ad\u00e2nc \u00een Clockworks, \
	\u0219i a jefuit Arhivele Moorcroft!

r.moorcroft_archives_2a = Ce sunt kats negri?

m.moorcroft_archives_3a = Kats negri sunt cele mai \u00eentunecate suflete ale fostului Trib Kat. \
	Poart\u0103 cel mai puternic blestem dintre toate \u0219i caut\u0103 f\u0103r\u0103 \u00eencetare s\u0103 devoreze aurele \
	magice. Consumul constant de energie \u00eei face incredibil de puternici. \n\
	\n\
	Probabil au fost atra\u0219i de puterea emanat\u0103 de grimoriile antice din Arhive. \n\
	\n\
	Te rog, {0}, trebuie s\u0103 ne aju\u021bi s\u0103 refacem Arhivele Moorcroft!

r.moorcroft_archives_3a = Te voi ajuta cu tot ce pot, Pembrooke.

m.moorcroft_archives_4a = Atunci cerceteaz\u0103 Clockworks \u0219i distruge acei kats nenoroci\u021bi! \
	Chiar dac\u0103 au m\u00e2ncat c\u0103r\u021bile, vei putea recupera Paginile Antice. Aceste pagini \u00eei pot fi \
	oferite lui Montague \u00een schimbul recompenselor. Ajut\u0103-ne \u0219i te vom r\u0103spl\u0103ti! \n\
	\n\
	Kats negri pot ap\u0103rea aleatoriu atunci c\u00e2nd \u00eent\u00e2lne\u0219ti spookats \u00een Tier 2 \u0219i Tier 3 \
