m.biscotti_2 = Minunat! Exist\u0103 dou\u0103 moduri \u00een care m\u0103 po\u021bi ajuta: \n\
	\n\
	Po\u021bi accepta noua Misiune de Prestigiu \u201eTotal Caketastrophe\u201d, care este disponibil\u0103 zilnic. \n\
	\n\
	Sau po\u021bi explora Clockworks \u0219i po\u021bi elimina infest\u0103rile acestor \u201eCreep Cakes\u201d ori de c\u00e2te \
	ori dore\u0219ti. Trebuie doar s\u0103 fii atent la glazur\u0103!

r.biscotti_2 = \u00cenc\u0103 mi se pare foarte ciudat, Biscotti, dar voi face tot ce pot.

m.biscotti_3 = Mul\u021bumesc, {0}, apreciez ajutorul. \u0218i te rog s\u0103-mi faci o favoare: nu pomeni \
	nimic despre acest mic \u201eincident\u201d celor de la Cartierul General Spiral...

r.biscotti_3 = \u00cencheie conversa\u021bia

