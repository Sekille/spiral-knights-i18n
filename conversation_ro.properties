# Court Sprite 1
#...................................................................................................

n.fc_sprite = Spirit

m.fc_court_1 = Tu... tu nu e\u0219ti unul dintre cei pierdu\u021bi. Trebuie s\u0103 fii puternic dac\u0103 ai \
	reu\u0219it s\u0103 ajungi p\u00e2n\u0103 \u00een aceast\u0103 curte. Te rog, trebuie s\u0103 m\u0103 aju\u021bi!

r.fc_court_1 = Pe cine ar trebui s\u0103 ajut?

m.fc_court_2 = Sunt un spirit, o for\u021b\u0103 a naturii invocat\u0103 \u00een acest t\u0103r\u00e2m pentru a stinge \
	focul nefiresc care \u00eel mistuie. Dar Vanaduke ne-a descoperit \u0219i ne-a \u00eentemni\u021bat. Am reu\u0219it \
	s\u0103 scap, \u00eens\u0103 ceilal\u021bi spirite se afl\u0103 \u00eenc\u0103 \u00een captivitatea lui.\n\
	\n\
	Acum nimeni nu poate trece dincolo de curte, deoarece coloane de foc \u00eentunecat blocheaz\u0103 \
	toate ie\u0219irile. Focul \u00eentunecat poate fi stins doar cu apa care curge din f\u00e2nt\u00e2nile spiritelor. \
	Aceast\u0103 ap\u0103 este cea mai pur\u0103 din \u00eentreaga natur\u0103 \u0219i izvor\u0103\u0219te direct din izvoarele aflate \
	\u00een t\u0103r\u00e2mul \u00eens\u0103\u0219i al Mamei Spiritelor.

r.fc_court_2 = F\u00e2nt\u00e2nile acelea par s\u0103 fie secate...

m.fc_court_3 = F\u0103r\u0103 puterea celorlalte spirite, apa nu va mai curge niciodat\u0103 prin acest t\u0103r\u00e2m. \
	Este nevoie de o leg\u0103tur\u0103 de concentrare cu Mama Spiritelor pentru a aduce chiar \u0219i cea mai \
	mic\u0103 pic\u0103tur\u0103 de ap\u0103 \u00eentr-o lume at\u00e2t de ap\u0103s\u0103toare. St\u0103p\u00e2nul acestui t\u0103r\u00e2m s-a asigurat c\u0103 \
	fl\u0103c\u0103rile din jurul lui vor arde mereu.

r.fc_court_3 = Voi elibera spiritele!

m.fc_court_4 = Atunci e\u0219ti \u0219i curajos, c\u0103l\u0103torule. \u00cemi po\u021bi g\u0103si semenii prin \u00eentreaga curte. \
	Fii \u00eens\u0103 foarte atent, deoarece supu\u0219ii \u00eenfrico\u0219\u0103tori ai lui Vanaduke \u00eei p\u0103zesc. Mul\u021bi \
	patruleaz\u0103 pe drumul principal, a\u0219a c\u0103 ai grij\u0103 pe unde mergi.\n\
	\n\
	Dup\u0103 ce g\u0103se\u0219ti un spirit, adu-l \u00eenapoi la cercul sacru pe care \u00eel vezi \u00een fa\u021ba ta. Cu \
	siguran\u021b\u0103 este sl\u0103bit de blestemul lui Vanaduke \u0219i va avea nevoie de refacere. C\u00e2nd ceilal\u021bi \
	\u0219ase se vor reuni cu noi, vom forma o leg\u0103tur\u0103 de concentrare cu Mama Spiritelor \u0219i vom \
	readuce apa \u00een f\u00e2nt\u00e2ni.

r.fc_court_4_accept = S\u0103 eliberez 6 spirite pierdute? Pot face asta!

r.fc_court_4 = M\u0103 voi \u00eentoarce \u00een cur\u00e2nd.

m.fc_court_5 = Fie ca Mama Spiritelor s\u0103 te c\u0103l\u0103uzeasc\u0103.

r.fc_court_5 = \u00cencheie conversa\u021bia


