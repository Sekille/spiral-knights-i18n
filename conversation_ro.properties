	val de energie provenit de la o poart\u0103 ne va oferi r\u0103spunsul de care avem nevoie. \n\
	\n\
	Nu po\u021bi spune c\u0103 locotenentul nu este dedicat muncii sale. Cred c\u0103 nu am v\u0103zut-o niciodat\u0103 \
	\u00eenchiz\u00e2nd ochii, dar\u0103mite dormind.

r.core_tech_3 = Voi continua s\u0103 explorez Clockworks \u0219i s\u0103 colectez mineralele necesare \
	cercet\u0103rilor voastre.

