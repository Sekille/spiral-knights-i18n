n.impostoclaus = Impostoclaus

m.impostoclaus = Glorp, glorp, glorp! Cr\u0103ciun fericit de Winterfest!\n\
	\n\
	Intr\u0103 \u00een spiritul s\u0103rb\u0103torilor cu lupte cu bulg\u0103ri de z\u0103pad\u0103 \u00een nivelurile Lockdown de iarn\u0103 \
	\u0219i schimb\u0103 monedele Krogmo pentru minunatele p\u0103l\u0103rii Santy!

r.impostoclaus = Cred \u00een tine, Impostoclaus!

m.impostoclaus_1a= Glorp! Glorp! Glorp! Cr\u0103ciun fericit de Winterfest!\n\
	\n\
	A sosit \u00een sf\u00e2r\u0219it acea perioad\u0103 special\u0103 a anului, c\u00e2nd o p\u0103tur\u0103 delicat\u0103 de z\u0103pad\u0103 alb\u0103 \
	acoper\u0103 Haven, iar fiecare Str\u0103in, fiecare snipe \u0219i fiecare cavaler \u00ee\u0219i umple inima de \
	bucurie festiv\u0103.\n\
	\n\
	Dar trebuie s\u0103-\u021bi spun c\u0103 lucrurile nu stau deloc bine. F\u0103r\u0103 vreun motiv \u00eentemeiat, un grup \
	de grinchlini cu inimi \u00eempietrite amenin\u021b\u0103 s\u0103 strice s\u0103rb\u0103toarea Winterfest!

r.impostoclaus_1a = Nu c\u00e2t timp sunt eu aici! Voi salva Winterfest! Cum pot ajuta?

m.impostoclaus_2a = Ce curaj, ce hot\u0103r\u00e2re! Da, poate c\u0103 ai o \u0219ans\u0103, dac\u0103 ai noroc, \u00eempotriva \
	acestor tic\u0103lo\u0219i care vor s\u0103 distrug\u0103 bucuria Winterfest. \n\
	\n\
	A\u0219adar, \u021bine minte c\u0103 a fost ad\u0103ugat\u0103 o misiune Winterfest. Ia-\u021bi sabia \u0219i \u00ee\u021bi voi oferi \
	recompense!

r.impostoclaus_2a = S\u0103 completez misiunea \u201eSalveaz\u0103 Winterfest!\u201d \u0219i s\u0103 primesc recompense speciale? \
	M\u0103 ocup imediat!

m.impostoclaus_3a = Glorp! Glorp! Glorp!

r.impostoclaus_3a = Vezi magazinul de recompense Winterfest
r.impostoclaus_3b = \u00cencheie conversa\u021bia

m.impostoclaus_win = Glorp! Glorp! Winterfest a fost salvat \u0219i un lucru este sigur: toate inimile \
	c\u00e2nt\u0103 acum de bucurie!

m.impostoclaus_fail = Misiunea noastr\u0103 de a salva Winterfest s-a \u00eencheiat cu o \u00eenfr\u00e2ngere! \
	Grinchlinii au c\u00e2\u0219tigat. Trebuie s\u0103 ne retragem!

