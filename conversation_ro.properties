m.mission_collectorknight_b = Au izbucnit din p\u0103m\u00e2nt peste tot \u00een jurul nostru...
m.mission_collectorknight_c = Locul acesta \u00eemi d\u0103 fiori.
m.mission_collectorknight_d = Te rog, recupereaz\u0103 spiritele de lupt\u0103!

m.mission_survivorknight_a = A-a-aten\u021bie... ne urm\u0103re\u0219te... ne supravegheaz\u0103 fiecare mi\u0219care!
m.mission_survivorknight_b = Ne-a v\u00e2nat... i-a prins pe to\u021bi ceilal\u021bi din echipa mea...
m.mission_survivorknight_c = Paznicul Wildwoods... \u00eengrozitorul Snarbolax!

m.mission_researcher_a = Studiam acel meteorit c\u00e2nd au ap\u0103rut lichenii!
m.mission_researcher_b = Suntem izola\u021bi! Te rog, ajut\u0103-ne s\u0103 \u00eenvingem lichenii!
m.mission_researcher_c = Nu \u0219tiu c\u00e2t va mai rezista c\u00e2mpul nostru de for\u021b\u0103...

m.mission_lockedoutknight_a = Mul\u021bumim pentru ajutor!
m.mission_lockedoutknight_b = Asiguram liftul c\u00e2nd u\u0219a s-a \u00eenchis \u00een urma noastr\u0103.
m.mission_lockedoutknight_c = Mul\u021bumim c\u0103 ne-ai salvat echipa!

m.mission_lab_bystander_a = Au ap\u0103rut de nic\u0103ieri...
m.mission_lab_bystander_b = Gardienii no\u0219tri au fost cople\u0219i\u021bi. Nu am avut nicio \u0219ans\u0103.
m.mission_lab_bystander_c = Am ridicat o baricad\u0103 \u00een jurul Artefactului, dar au reu\u0219it s\u0103 o \
	distrug\u0103. \u00cemi pare r\u0103u...

m.seerus_1 = Cau\u021bi puterea? Furia unei stele arz\u0103toare, \u00eenchis\u0103 \u00een o\u021bel? \u00ce\u021bi voi ar\u0103ta ambele!
m.seerus_defeated = A\u0219 prefera s\u0103 ard\u0103 totul dec\u00e2t s\u0103 dau Arsenalul pe m\u00e2na altcuiva!

m.mission_cogmaster_1 = Dou\u0103 tunuri au \u00eencetat s\u0103 trag\u0103! Raporta\u021bi imediat, nemernicilor!
m.mission_cogmaster_2 = Intru\u015fi \u00een Arsenalul meu? M\u0103 voi asigura c\u0103 pleca\u021bi... \u00een lini\u0219te.
m.mission_cogmaster_3 = Crede\u021bi c\u0103 pute\u021bi pur \u0219i simplu s\u0103 deschide\u021bi u\u0219a principal\u0103 \u0219i s\u0103 intra\u021bi?! \
	Ve\u021bi pl\u0103ti pentru asta!
m.mission_cogmaster_4 = Cine v-a trimis, asasini infernali de fier? Herex? Nu conteaz\u0103. \
	Exist\u0103 metode prin care pot afla...
m.mission_crimson_propaganda_1 = Cei Nou\u0103 v\u0103d totul \u0219i aud totul.
m.mission_crimson_propaganda_2 = Numai Regele Tinkinzar de\u021bine Legea de Fier!
m.mission_explosion_warning = Avertisment! Explozii detectate! Evacua\u021bi imediat zona!
m.mission_gatelock_disengage_1 = Blocajul por\u021bii 1 se dezactiveaz\u0103.
m.mission_gatelock_disengage_2 = Blocajul por\u021bii 2 se dezactiveaz\u0103.
m.mission_cogknight_camp_a = \u00cen sf\u00e2r\u0219it, \u00eent\u0103riri de la Cartierul General Spiral!
m.mission_cogknight_camp_b = Una dintre echipele noastre a reu\u0219it s\u0103 intre, dar a fost izolat\u0103. \
	Salveaz\u0103-i dac\u0103 po\u021bi!
m.mission_cogknight_camp_c = Trebuie s\u0103 intri \u0219i s\u0103 distrugi tunurile acelea!
m.mission_cogknight_camp_d = Ai grij\u0103! Gremlinii au \u00eemp\u00e2nzit locul cu s\u00e2rm\u0103 ghimpat\u0103.
m.mission_cogknight_camp_e = Gremlinii ascund explozibili \u00een acele bunc\u0103re. \
	Sunt sigur c\u0103 dac\u0103 arunci ceva \u00een\u0103untru, vor exploda!
m.mission_cogknight_camp_f = Ai grij\u0103 acolo \u00een\u0103untru!
m.mission_cogknight_battle_a = Nu mai... pot continua...
m.mission_cogknight_battle_b = Nu vom putea \u00eenainta \u00een baz\u0103 p\u00e2n\u0103 nu distrugi acele tunuri de artilerie!
m.mission_cogknight_battle_c = Intr\u0103, folose\u0219te liftul... distruge orice controleaz\u0103 tunurile acelea!
m.mission_cogknight_battle_d = Ai reu\u0219it! Explozia aceea a distrus tunurile!
m.mission_cogknight_prisoner_a = Mare\u0219alul Seerus este nebun! Ar trebui s\u0103 evadez \u00een Emberlight.
m.mission_cogknight_prisoner_b = Voi fugi pe furi\u0219 dup\u0103 ce zona va fi sigur\u0103. \u00ce\u021bi mul\u021bumesc c\u0103 m-ai salvat!
m.mission_cogknight_wounded = . . .
m.mission_cogknight_ambushed = A-a-aten\u021bie... ei... sunt peste tot... \u00een umbre...!
m.mission_cogknight_camp2_a = Am v\u0103zut exploziile tocmai de aici, din tab\u0103r\u0103! A fost incredibil!
m.mission_cogknight_camp2_b = Nu am fi trecut de artileria aceea f\u0103r\u0103 ajutorul t\u0103u!
m.mission_cogknight_camp2_c = Rezist\u0103!
m.mission_cogknight_camp2_d = I-am v\u0103zut pe gremlini ascunz\u00e2nd mine acolo. Ai grij\u0103 pe unde calci!
m.mission_cogknight_camp2_e = Vom \u021bine pozi\u021bia!
m.mission_cogknight_camp2_f = Strecoar\u0103-te prin lateral \u0219i vezi dac\u0103 po\u021bi intra \u00een cl\u0103direa de control a por\u021bii!
m.mission_cogknight_camp2_g = Dac\u0103 ar exista m\u0103car o metod\u0103 de a deschide por\u021bile acelea!
m.mission_cogknight_camp3_a = Am intrat! Asta este!
m.mission_cogknight_camp3_b = Ai grij\u0103 c\u00e2nd \u00eel \u00eenfrun\u021bi pe Mare\u0219al!
m.mission_cogknight_camp3_c = Le-am str\u0103puns ap\u0103rarea. Acum sunt \u00eencol\u021bi\u021bi!
m.mission_cogknight_camp3_d = Mult noroc acolo \u00een\u0103untru! \u0218tim c\u0103 po\u021bi reu\u0219i!
m.mission_cogknight_epilogue_a = Nu-\u021bi face griji pentru Feron. Se va vindeca \u00een cel mai scurt timp.
m.mission_cogknight_epilogue_b = G\u00e2nde\u0219te-te c\u0103 toate acestea s-ar fi putut dezl\u0103n\u021bui asupra Haven...
m.mission_cogknight_epilogue_c = Victoria este a noastr\u0103!
m.mission_cogknight_epilogue_d = P\u00e2n\u0103 acum nu am recuperat trupul lui Seerus, dar este imposibil ca cineva \
