# Tylen Bazaar Tour
#...................................................................................................

n.bazaar_tour = Tylen

m.bazaar_tour_1a = Bine ai venit \u00een Bazaar, {0}! Ai dori un tur al magazinelor sau al serviciilor?

r.bazaar_tour_1a = Sigur, arat\u0103-mi magazinele. (Urmeaz\u0103-l pe Tylen)
r.bazaar_tour_1b = Ce servicii pot g\u0103si aici? (Urmeaz\u0103-l pe Tylen)
r.bazaar_tour_1c = Nu, mul\u021bumesc. Voi explora pe cont propriu.

m.bazaar_tour_2a = Str\u0103ini precum Quillion v\u00e2nd arme \u0219i armuri aici. Fiecare este specializat \
	\u00eentr-un anumit tip de obiecte, a\u0219a c\u0103 vorbe\u0219te cu ei ca s\u0103 afli ce au de oferit. Nu sunt \
	prea vorb\u0103re\u021bi, dar \u00een fiecare zi au marf\u0103 nou\u0103! \n\
	\n\
	Asigur\u0103-te doar c\u0103 ai rangul necesar pentru a echipa obiectul respectiv!

r.bazaar_tour_2a = Str\u0103inii v\u00e2nd \u0219i altceva \u00een afar\u0103 de arme \u0219i echipament?

m.bazaar_tour_3a = M\u0103 bucur c\u0103 ai \u00eentrebat! Bine\u00een\u021beles c\u0103 da! Hai s\u0103 mergem la Vatel.

r.bazaar_tour_3a = (Urmeaz\u0103-l pe Tylen)
#(move to Vatel)

m.bazaar_tour_4a = Vatel \u00ee\u021bi va vinde o selec\u021bie de re\u021bete, precum \u0219i vopsele pentru schimbarea \
	culorii personajului \u0219i alte obiecte.

r.bazaar_tour_4a = Re\u021bete? Pentru arme \u0219i echipament?

m.bazaar_tour_5a = Exact! Po\u021bi ob\u021bine re\u021bete \u0219i materiale pentru a crea arme \u0219i echipamente \
	alchimic la sta\u021biile de alchimie. Haide, \u00ee\u021bi voi ar\u0103ta una.

r.bazaar_tour_5a = \u00cen regul\u0103.
#(move to alchemy station)

m.bazaar_tour_6a = Aici avem o sta\u021bie de alchimie, de care cu siguran\u021b\u0103 te vei folosi des \
	pe m\u0103sur\u0103 ce \u00ee\u021bi \u00eembun\u0103t\u0103\u021be\u0219ti arsenalul. \n\
	\n\
	Acestea au fost magazinele. Ai dori s\u0103 continu\u0103m turul?

r.bazaar_tour_6a = A\u0219 vrea s\u0103 rev\u0103d magazinele. (Urmeaz\u0103-l pe Tylen)
r.bazaar_tour_6b = A\u0219 vrea s\u0103 v\u0103d serviciile. (Urmeaz\u0103-l pe Tylen)
r.bazaar_tour_6c = Nu, mul\u021bumesc. Voi explora pe cont propriu.

m.bazaar_tour_7a = Punch \u0219i Vise sunt fierari gremlini care pot modifica propriet\u0103\u021bile armelor \
	\u0219i echipamentului t\u0103u.

r.bazaar_tour_7a = Gremlini?!

m.bazaar_tour_8a = U\u0219urel, {0}. Nu to\u021bi gremlinii sunt la fel. Unii nu sunt de acord cu \
	metodele Regelui Tinkinzar \u0219i ale Ordinului Crimson. De fapt, am auzit c\u0103 undeva \u00een \
	ad\u00e2ncurile Clockworks exist\u0103 un \u00eentreg ora\u0219 plin de gremlini care au p\u0103r\u0103sit Marea Colonie.

r.bazaar_tour_8a = Ei bine, dac\u0103 tu spui...

m.bazaar_tour_9a = Bun, s\u0103 revenim la treab\u0103. \n\
	\n\
	Punch poate ad\u0103uga Variante Unice, un fel de bonus special pentru armele \u0219i echipamentul t\u0103u, \
	contra cost. Metodele sale sunt \u00eens\u0103... haotice. Nu \u0219tii niciodat\u0103 ce vei ob\u021bine. \n\
	\n\
	Vise este pu\u021bin mai precis. Contra cost, \u00ee\u021bi poate dezlega armele \u0219i echipamentul, \
	permi\u021b\u00e2ndu-\u021bi s\u0103 vinzi sau s\u0103 oferi din nou obiectul respectiv!

r.bazaar_tour_9a = Foarte util! Voi \u021bine minte. Ce mai ai?

m.bazaar_tour_10a = Hai s\u0103-l vizit\u0103m pe Brinks.

r.bazaar_tour_10a = (Urmeaz\u0103-l pe Tylen)
#(move to Brinks)

m.bazaar_tour_11a = Brinks este Negustorul de Jetoane. El ofer\u0103 anumite obiecte cavalerilor \
	\u00een schimbul jetoanelor care pot fi colectate \u00een Clockworks. Jetoanele pot fi g\u0103site \u00een \
	blocurile cu comori, oferite ca recompense pentru misiuni sau ob\u021binute prin \u00eenfr\u00e2ngerea \
	unor mon\u0219tri-\u0219efi speciali.

r.bazaar_tour_11a = Am \u00een\u021beles. Mai este ceva?

m.bazaar_tour_12a = Mai avem un singur magazin de vizitat \u0219i apoi am terminat. Am p\u0103strat ce e \
	mai bun pentru final.

r.bazaar_tour_12a = (Urmeaz\u0103-l pe Tylen)
#(move to Bechamel)

m.bazaar_tour_13a = Aici \u00eel avem pe Bechamel, specialistul \u00een accesorii. El poate ad\u0103uga \
	accesorii echipamentului t\u0103u, at\u00e2t timp c\u00e2t ai un tichet. Cu ajutorul accesoriilor, \u00ee\u021bi po\u021bi \
	face echipamentul cu adev\u0103rat remarcabil. \u00ce\u021bi recomand cu c\u0103ldur\u0103 s\u0103 \u00eencerci. \u00cen cur\u00e2nd, \
	toat\u0103 lumea te va admira!

r.bazaar_tour_13a = De unde pot ob\u021bine tichete pentru accesorii?

m.bazaar_tour_14a = Po\u021bi g\u0103si tichete pentru accesorii \u00een cutiile \u00eencuiate sau la Casa de \
	Licita\u021bii, dac\u0103 un alt cavaler are vreunul de v\u00e2nzare.

r.bazaar_tour_14a = Am \u00een\u021beles.

m.bazaar_tour_15a = Ei bine, cam acestea sunt lucrurile de baz\u0103 despre Bazaar. Este un loc \
	fantastic \u00een care po\u021bi g\u0103si aproape tot ce ai nevoie. \n\
	\n\
	Vrei s\u0103-\u021bi prezint din nou totul sau crezi c\u0103 te-ai descurcat?

r.bazaar_tour_15a = A\u0219 vrea s\u0103 v\u0103d magazinele. (Urmeaz\u0103-l pe Tylen)
r.bazaar_tour_15b = A\u0219 vrea s\u0103 rev\u0103d serviciile. (Urmeaz\u0103-l pe Tylen)
r.bazaar_tour_15c = Nu, mul\u021bumesc. Voi explora pe cont propriu.

m.bazaar_tour_16a = \u00cenc\u0103 un tur? Nicio problem\u0103, urmeaz\u0103-m\u0103!

r.bazaar_tour_16a = (Urmeaz\u0103-l pe Tylen)

m.bazaar_tour_16b = Minunat! M\u0103 bucur c\u0103 te-am putut ajuta s\u0103 te orientezi. Mult noroc, {0}!

r.bazaar_tour_16b = Mul\u021bumesc, Tylen! Ne mai vedem!



# Monstrous Codex
