m.npc_veteran_b = Nu-\u021bi uita scutul, \u00ee\u021bi poate salva via\u021ba!
m.npc_veteran_c = Port mereu cu mine un blaster. Nu se \u0219tie niciodat\u0103 c\u00e2nd \u00eemi poate fi de folos.
m.npc_veteran_d = Trebuie s\u0103 m\u0103 asigur c\u0103 recru\u021bii ace\u0219tia noi nu intr\u0103 \u00een bucluc.
m.npc_veteran_e = O bomb\u0103 este excelent\u0103 pentru a face fa\u021b\u0103 unei hoarde de mon\u0219tri.
m.npc_veteran_f = P\u0103strez mereu o sabie pentru \u00eent\u00e2lnirile de aproape.
m.npc_veteran_g = Preg\u0103tirea este cel mai bun instrument pentru a supravie\u021bui \u00een Clockworks.
m.npc_veteran_h = R\u0103m\u00e2i al\u0103turi de echipa ta. Nu uita c\u0103 este periculos s\u0103 mergi singur!

t.npc_captainknight = C\u0103pitan cavaler
m.npc_captainknight_a = Nu uita\u021bi antrenamentul, cavaleri!
m.npc_captainknight_b = Ridica\u021bi scuturile pentru a bloca atacurile!
m.npc_captainknight_c = Nu uita\u021bi s\u0103 v\u0103 preg\u0103ti\u021bi bombele!
m.npc_captainknight_d = Coordona\u021bi-v\u0103 atacurile!
m.npc_captainknight_e = Folosi\u021bi mediul \u00eenconjur\u0103tor \u00een avantajul vostru!
m.npc_captainknight_f = Ad\u0103posti\u021bi-v\u0103 dac\u0103 sunte\u021bi cople\u0219i\u021bi!
m.npc_captainknight_g = Nu uita\u021bi s\u0103 v\u0103 ajuta\u021bi coechipierii!

t.npc_recruit = Recrut
m.npc_recruit_a = Trebuie doar s\u0103 m\u0103 odihnesc pu\u021bin \u00eenainte s\u0103 continui.
m.npc_recruit_b = Oare mi-am l\u0103sat sabia Calibur la Sta\u021bia de Arsenal...?
m.npc_recruit_c = Cred c\u0103 ar trebui s\u0103 creez un scut mai bun c\u00e2nd m\u0103 \u00eentorc \u00een Haven.
m.npc_recruit_d = Aceasta este prima mea expedi\u021bie \u00een Clockworks!
m.npc_recruit_e = Ai vreun sfat pentru mine?
m.npc_recruit_f = Unde este siguran\u021ba acestei arme?
m.npc_recruit_g = Ai \u00eent\u00e2lnit deja o sal\u0103 a pericolelor? Am auzit c\u0103 sunt foarte dificile.

m.npc_survivorknight_a = Ei... i-au prins pe to\u021bi \u00een afar\u0103 de mine. Eu doar m-am ascuns \u00eentr-un col\u021b.
m.npc_survivorknight_b = Au venit din \u00eentuneric. Nu am avut timp s\u0103 reac\u021bion\u0103m.
m.npc_survivorknight_c = Nu eu am ales asta.

t.npc_mineraltech = Bryel
m.npc_mineraltech_a = Sunt cercet\u0103tor de teren \u0219i lucrez sub \u00eendrumarea Cavalerului Geolog-\u0218ef Wegner.
m.npc_mineraltech_b = Hmm, anumite combina\u021bii par s\u0103 atrag\u0103 diferite tipuri de mon\u0219tri.
m.npc_mineraltech_c = Nu-l b\u0103ga \u00een seam\u0103 pe Hubert. I-au fost \u00eendep\u0103rta\u021bi \u021bepii.

m.npc_minerknight_a = Po\u021bi transporta doar un mineral odat\u0103, a\u0219a c\u0103 alege-l pe cel mai mare.
m.npc_minerknight_b = Cartierul General Spiral vrea s\u0103 transport\u0103m aceste minerale \u00eenapoi \u00een Haven.
m.npc_minerknight_c = Se spune c\u0103 aceste minerale alimenteaz\u0103 toate por\u021bile din Arcade.

m.npc_techknight_a = Colectez mostre din toate zonele acestui strat.
m.npc_techknight_b = Datele bune sunt ca o budinc\u0103 bun\u0103: niciodat\u0103 nu po\u021bi avea prea multe.
m.npc_techknight_c = \u00cenc\u0103 doar c\u00e2teva teste...

m.npc_campknight_a = Ia loc \u0219i odihne\u0219te-te pu\u021bin.
m.npc_campknight_b = Vino s\u0103 te \u00eenc\u0103lze\u0219ti l\u00e2ng\u0103 foc.
m.npc_campknight_c = Deja simt cum dispare frigul.

m.npc_graveknight_a = Nu, sunt pur \u0219i simplu prea mul\u021bi... Nu-i mai pot \u00eenfrunta. \
	Tot ce ne-a mai r\u0103mas este lumina acestor lum\u00e2n\u0103ri. F\u0103r\u0103 ea...

m.npc_rummageknight_a = \u0218tiu c\u0103 era pe aici undeva...
m.npc_rummageknight_b = Nu pot vorbi acum.

m.npc_supplies_a = Proviziile au ajuns exact la timp.
m.npc_supplies_b = Au trecut zile \u00eentregi de c\u00e2nd nu am mai primit provizii proaspete.
m.npc_supplies_c = Mul\u021bumim c\u0103 ai reaprovizionat tab\u0103ra.

m.npc_onwatch_a = Nu pot vorbi acum. Sunt de paz\u0103.
m.npc_onwatch_b = \u0218tiu c\u0103 se vor \u00eentoarce.
m.npc_onwatch_c = Ai v\u0103zut ceva acolo afar\u0103?

t.npc_lostknight_a = Harmon
m.npc_lostknight_a = Mul\u021bumesc c\u0103 m-ai \u201esalvat\u201d, dar m\u0103 simt bine.
m.npc_lostknight_b = M\u0103 bucur s\u0103 \u0219tiu c\u0103 Cartierul General Spiral nu m-a uitat.
m.npc_lostknight_c = A\u0219 putea pleca, dar g\u00e2nde\u0219te-te la c\u00e2te lucruri a\u0219 putea \u00eenv\u0103\u021ba dac\u0103 a\u0219 r\u0103m\u00e2ne!

m.npc_teaser_knight = Ultima misiune a fost cu adev\u0103rat ciudat\u0103. Eliberam drumul c\u0103tre un lift \
	c\u00e2nd am observat ni\u0219te structuri neobi\u0219nuite \u00een dep\u0103rtare. Totu\u0219i, nu am g\u0103sit nicio cale \
	de a ajunge la ele. Presupun c\u0103 va trebui s\u0103 fim aten\u021bi pe viitor. La urma urmei, Clockworks \
	se schimb\u0103 \u00een permanen\u021b\u0103.

r.npc_teaser_knight = \u00cencheie conversa\u021bia.

m.npc_supply_teaser_knight = \u00cemi pare r\u0103u, nu am prea mult timp s\u0103 vorbesc. Trebuie s\u0103 duc \
	toate proviziile acestea la avanposturile noastre din fa\u021b\u0103. Oamenii uit\u0103 adesea c\u0103, f\u0103r\u0103 \
	cavaleri ca noi, care transport\u0103 provizii \u00een Clockworks, capacitatea noastr\u0103 de a cerceta \
	zonele mai \u00eendep\u0103rtate ar fi foarte limitat\u0103. Ce munc\u0103 nerecunosc\u0103toare, nu-i a\u0219a?

m.npc_spikeknight_haven_a = Furtun\u0103 de energie \u00een ad\u00e2ncurile Clockworks.
m.npc_spikeknight_haven_b = M\u0103sur\u0103torile din Haven arat\u0103 bine p\u00e2n\u0103 acum...
m.npc_spikeknight_haven_c = Ai v\u0103zut priveli\u0219tea din Arcade?

m.npc_spikeexplorer_clockworks_a = Mon\u0219trii cu \u021bepi primesc \u0219i mai mul\u021bi \u021bepi!
m.npc_spikeexplorer_clockworks_b = Unul dintre ei a aruncat un \u021bep \u00een mine!
m.npc_spikeexplorer_clockworks_c = Nu l\u0103sa \u021bepii s\u0103 cad\u0103 l\u00e2ng\u0103 mon\u0219tri!

#m.npc_spikedata_clockworks_a = Nu pot s\u0103 nu m\u0103 \u00eentreb...
#m.npc_spikedata_clockworks_b = Oare ce fac gremlinii cu to\u021bi ace\u0219ti \u021bepi?
m.npc_spikedata_beast_a = Am observat ceva ciudat dup\u0103 ultima furtun\u0103...
m.npc_spikedata_beast_b = M\u0103sur\u0103tori neobi\u0219nuite provenite de la mineralele din zon\u0103...
m.npc_spikedata_clockworks_c = Hmm...

#m.npc_spikeresearcher_clockworks_a = Este \u0219i mai frumos aici jos!
#m.npc_spikeresearcher_clockworks_b = \u00cemi place s\u0103 ies pe teren.
#m.npc_spikeresearcher_clockworks_c = Mul\u021bumesc pentru ajutorul la colectarea \u021bepilor!
m.npc_spikeresearcher_beast_a = Ai vorbit cu Torch?
m.npc_spikeresearcher_beast_b = Totul a fost din cauza sosului s\u0103u de anghinare.
m.npc_spikeresearcher_beast_c = \u0218i totu\u0219i, a m\u00e2ncat \u0219i el din el.

# Casino NPCs
#...................................................................................................

m.casino_jelly_a = Glorp! Am \u00eenghi\u021bit o coroan\u0103. Delicioas\u0103.
m.casino_jelly_b = Tocmai m-am \u00eentors de la frizer. Se vede?
m.casino_jelly_c = \u00centr-o zi voi c\u00e2\u0219tiga suficient ca s\u0103-mi construiesc propriul palat! Glorp glorp!
m.casino_jelly_d = Am pierdut totul!

m.casino_yesman_a = Distrac\u021bie pl\u0103cut\u0103!
m.casino_yesman_b = Toat\u0103 lumea este binevenit\u0103 la Golden Slime!
m.casino_yesman_c = \u00cemi pare r\u0103u, ai ratat Happy Hour cu un minut. Data viitoare!
m.casino_yesman_d = Toat\u0103 lumea c\u00e2\u0219tig\u0103 la Golden Slime!
m.casino_yesman_e = Angaja\u021bii Undercorp primesc o can\u0103 gratuit\u0103 la fiecare vizit\u0103.
m.casino_yesman_f = Bine ai venit la High Wobbler Lounge!

m.casino_pitboss_a = Productivitatea a crescut cu dou\u0103 procente de c\u00e2nd am introdus orele suplimentare obligatorii.
m.casino_pitboss_b = M-am promovat singur \u00een func\u021bia de Manager Senior al Instrumentelor \u00censp\u0103im\u00e2nt\u0103toare de Distrugere.
m.casino_pitboss_c = Mi-am exploatat angaja\u021bii ca s\u0103 ajung unde sunt ast\u0103zi.
m.casino_pitboss_d = Tocmai am plasat o nou\u0103 comand\u0103 mare de rechizite de birou. R\u0103m\u00e2nem mereu f\u0103r\u0103 ele.
m.casino_pitboss_e = Tipul de la Devil-IT a vrut s\u0103 ne modernizeze biroul \u0219i s\u0103 folosim numai simboluri, dar mie \u00eemi place s\u0103 irosesc h\u00e2rtie.

m.casino_monster_a = Hei, f\u0103r\u0103 tri\u0219at!
m.casino_monster_b = Nu te mai uita peste um\u0103rul meu.
m.casino_monster_c = Nu cred c\u0103 va observa cineva c\u0103 lipsesc.
m.casino_monster_d = \u00cemi po\u021bi \u00eemprumuta arma ta?
m.casino_monster_e = Hei, nu bloca priveli\u0219tea!
m.casino_monster_f = \u0218\u0219\u0219, s\u0103 nu spui nim\u0103nui c\u0103 sunt aici.
m.casino_monster_g = Fie s\u0103rb\u0103toresc aici, fie \u00eemi \u00eenec amarul.
m.casino_monster_h = Norocul se schimb\u0103, uneori din r\u0103u \u00een \u0219i mai r\u0103u...
m.casino_monster_i = Sunt aici s\u0103 te ascult. Spune tot ce ai pe suflet.

m.casino_klepto_a = Nu voi fura nimic... Promit!
m.casino_klepto_b = Hei, ce este acolo?
m.casino_klepto_c = Nu sunt Kleptolisk-ul pe care \u00eel cau\u021bi.

m.casino_skelly_a = At\u00e2t de... luminos...
m.casino_skelly_b = Mai \u00eencearc\u0103...
m.casino_skelly_c = Nu am plecat niciodat\u0103...

m.casino_royaljelly_a = Tocmai am zburat din Moorcroft \u0219i, b\u0103iete, nucleele mele regale sunt epuizate.
m.casino_royaljelly_b = Poftim, o bijuterie gelatinoas\u0103 pentru tine...
m.casino_royaljelly_c = Trei licheni intr\u0103 \u00eentr-o camer\u0103...
m.casino_royaljelly_d = Nu uita s\u0103 la\u0219i bac\u0219i\u0219 personalului.

m.casino_guard_a = Glorp! Aici nu sunt probleme.
m.casino_guard_b = Golden Slime \u00ee\u021bi ureaz\u0103 bun venit. Glorp!
m.casino_guard_c = Glorp glorp. Distrac\u021bie pl\u0103cut\u0103!

m.casino_imposto_a = \u00cenc\u0103 un Gel Core, v\u0103 rog. Agitat.
m.casino_imposto_b = Oh, nu te-am mai v\u0103zut pe aici!
m.casino_imposto_c = Chelner? Oh, ierta\u021bi-m\u0103, domnule.

m.casino_bouncer_a = Numai membrii Clubului C.U.B.E. pot intra \u00een High Wobbler Lounge.
m.casino_bouncer_b = \u00cemi pare r\u0103u, doar pentru VIP-uri.
m.casino_bouncer_c = Bine ai venit la High Wobbler Lounge!
m.casino_bouncer_d = Bine ai venit, intr\u0103 pe aici.

